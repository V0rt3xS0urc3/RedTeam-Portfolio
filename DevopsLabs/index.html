{id:'lab36k', title:'🔴 K8s: Health Checks (Liveness, Readiness, Startup Probes)', desc:'Configurar probes para aplicaciones', dif:'Senior', xp:450, steps:[
{id:'s1', cmd:'kubectl apply -f - <<EOF\napiVersion: v1\nkind: Pod\nmetadata:\n  name: health-check-pod\nspec:\n  containers:\n  - name: nginx\n    image: nginx\n    livenessProbe:\n      httpGet:\n        path: /\n        port: 80\n      initialDelaySeconds: 5\nEOF', desc:'Crear pod con livenessProbe', hint:'kubectl apply -f'},
{id:'s2', cmd:'kubectl get pod health-check-pod', desc:'Verificar que el pod está corriendo', hint:'kubectl get pod'},
{id:'s3', cmd:'kubectl describe pod health-check-pod | grep -A5 "Liveness"', desc:'Ver configuración de livenessProbe', hint:'kubectl describe pod'},
{id:'s4', cmd:'kubectl delete pod health-check-pod', desc:'Limpiar pod', hint:'kubectl delete pod'},
{id:'s5', cmd:'kubectl get pods | grep health-check', desc:'Verificar que el pod fue eliminado', hint:'kubectl get pods'}
]},
{id:'lab37k', title:'🔴 K8s: Secrets y ConfigMaps Avanzado', desc:'Gestionar configuraciones y secretos', dif:'Senior', xp:450, steps:[

{id:'s5', cmd:'kubectl delete configmap app-config && kubectl delete secret db-secret', desc:'Limpiar ConfigMap y Secret', hint:'kubectl delete'}

{id:'lab38k', title:'🔴 K8s: Ingress Controller', desc:'Exponer servicios al exterior', dif:'Senior', xp:500, steps:[
{id:'s1', cmd:'kubectl create deployment nginx --image=nginx && kubectl expose deployment nginx --port=80 --type=ClusterIP', desc:'Crear deployment y service', hint:'kubectl create deployment'},
{id:'s2', cmd:'kubectl apply -f - <<EOF\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: nginx-ingress\nspec:\n  rules:\n  - host: nginx.local\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: nginx\n            port:\n              number: 80\nEOF', desc:'Crear Ingress', hint:'kubectl apply -f'},
{id:'s3', cmd:'kubectl get ingress', desc:'Ver Ingress creado', hint:'kubectl get ingress'},
{id:'s4', cmd:'kubectl describe ingress nginx-ingress', desc:'Ver detalles del Ingress', hint:'kubectl describe ingress'},
{id:'s5', cmd:'kubectl delete deployment nginx && kubectl delete service nginx && kubectl delete ingress nginx-ingress', desc:'Limpiar recursos', hint:'kubectl delete'}
]},
{id:'lab39k', title:'🟣 K8s: Persistent Volumes', desc:'Almacenamiento persistente con PV y PVC', dif:'Experto', xp:550, steps:[
{id:'s1', cmd:'kubectl apply -f - <<EOF\napiVersion: v1\nkind: PersistentVolume\nmetadata:\n  name: pv-1\nspec:\n  capacity:\n    storage: 1Gi\n  accessModes:\n    - ReadWriteOnce\n  hostPath:\n    path: /data/pv-1\nEOF', desc:'Crear PersistentVolume', hint:'kubectl apply -f'},
{id:'s2', cmd:'kubectl get pv', desc:'Ver PV creado', hint:'kubectl get pv'},
{id:'s3', cmd:'kubectl apply -f - <<EOF\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: pvc-1\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 1Gi\nEOF', desc:'Crear PersistentVolumeClaim', hint:'kubectl apply -f'},
{id:'s4', cmd:'kubectl get pvc', desc:'Ver PVC creado', hint:'kubectl get pvc'},
{id:'s5', cmd:'kubectl delete pv pv-1 && kubectl delete pvc pvc-1', desc:'Limpiar recursos', hint:'kubectl delete'}
]},
{id:'lab40k', title:'🟣 K8s: RBAC Avanzado', desc:'Roles, ClusterRoles, ServiceAccounts', dif:'Experto', xp:550, steps:[
{id:'s1', cmd:'kubectl create serviceaccount dev-user', desc:'Crear ServiceAccount', hint:'kubectl create serviceaccount'},
{id:'s2', cmd:'kubectl apply -f - <<EOF\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  namespace: default\n  name: pod-reader\nrules:\n- apiGroups: [""]\n  resources: ["pods"]\n  verbs: ["get", "list"]\nEOF', desc:'Crear Role para leer pods', hint:'kubectl apply -f'},
{id:'s3', cmd:'kubectl apply -f - <<EOF\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: read-pods\n  namespace: default\nsubjects:\n- kind: ServiceAccount\n  name: dev-user\n  namespace: default\nroleRef:\n  kind: Role\n  name: pod-reader\n  apiGroup: rbac.authorization.k8s.io\nEOF', desc:'Crear RoleBinding', hint:'kubectl apply -f'},
{id:'s4', cmd:'kubectl auth can-i get pods --as=system:serviceaccount:default:dev-user', desc:'Verificar permisos', hint:'kubectl auth can-i'},
{id:'s5', cmd:'kubectl delete serviceaccount dev-user && kubectl delete role pod-reader && kubectl delete rolebinding read-pods', desc:'Limpiar recursos', hint:'kubectl delete'}]}

function checkAchievements(){const na=[];for(const[k,a]of Object.entries(ACHS)){if(!ST.achieve.has(k)&&a.c(ST)){ST.achieve.add(k);na.push(a);}}if(na.length>0){na.forEach(a=>{print(`🏅 ¡LOGRO: ${a.icon} ${a.name}!`,'achievement');showToast(`${a.icon} ${a.name}!`,'achievement');});updateBadgesHeader();saveProgress();}}
function updateBadgesHeader(){const h=document.getElementById('badgesHeader');h.textContent='';for(const[k,a]of Object.entries(ACHS)){const u=ST.achieve.has(k);const s=document.createElement('span');s.className='badge-icon'+(u?'':' locked');s.textContent=a.icon;s.title=u?a.name:'???';h.appendChild(s);}}
function saveProgress(){try{const d={xp:ST.xp,mDone:[...ST.mDone],lDone:[...ST.lDone],lSteps:Object.fromEntries(Object.entries(ST.lSteps).map(([k,v])=>[k,[...v]])),achieve:[...ST.achieve]};localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){console.warn(e);}}
function loadProgress(){try{const s=localStorage.getItem(STORAGE_KEY);if(!s)return false;const d=JSON.parse(s);ST.xp=d.xp||0;ST.mDone=new Set(d.mDone||[]);ST.lDone=new Set(d.lDone||[]);ST.achieve=new Set(d.achieve||[]);ST.lSteps={};if(d.lSteps)for(const[k,v]of Object.entries(d.lSteps))ST.lSteps[k]=new Set(v);return true;}catch(e){return false;}}

// ==================== NAVEGACIÓN ====================
function filterContent(cat){
    ST.filter=cat;ST.lab=null;ST.labStep=0;ST.mission=null;ST.mdata=null;ST.cat=cat;
    updateFilterButtons();renderItems();
}
function updateFilterButtons(){
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    const ab=document.querySelector(`.filter-btn.${ST.filter}`);
    if(ab)ab.classList.add('active');
}
function renderItems(){
    const list=document.getElementById('missionList'),countEl=document.getElementById('missionCount');
    list.textContent='';let items=[];
    
    // FILTRO "LABS": mostrar solo laboratorios
    if(ST.filter==='labs'){
        CATS.forEach(cat=>{
            if(cat.labs&&cat.labs.length>0){
                cat.labs.forEach(lab=>{
                    const done=ST.lDone.has(lab.id);
                    items.push({type:'lab',...lab,catName:cat.name,catId:cat.id});
                });
            }
        });
        countEl.textContent=`🧪 Labs (${items.length})`;
    }
    // FILTRO "ALL": mostrar resumen de categorías
    else if(ST.filter==='all'){
        CATS.forEach(cat=>{
            const cm=cat.misiones;const cl=cat.labs||[];
            const dm=cm.filter(m=>ST.mDone.has(m.id)).length;
            const dl=cl.filter(l=>ST.lDone.has(l.id)).length;
            const total=cm.length+cl.length;const done=dm+dl;
            const pct=total>0?Math.round((done/total)*100):0;
            items.push({type:'cat',id:cat.id,name:cat.name,icon:cat.icon||'',done,total,pct,dm,cm:cm.length,dl,cl:cl.length});
        });
        countEl.textContent=`📋 Ruta Completa (${items.length})`;
    }
    // FILTRO ESPECÍFICO: mostrar prácticas de esa categoría
    else{
        const cat=CATS.find(c=>c.id===ST.filter);
        if(cat){cat.misiones.forEach(m=>items.push({type:'m',...m}));}
        countEl.textContent=`📋 ${cat?cat.name:ST.filter.toUpperCase()} (${items.length})`;
    }
    
    items.forEach(item=>{
        const div=document.createElement('div');
        if(item.type==='cat'){
            div.className='lab-item'+(item.done===item.total?' done':'');
            div.innerHTML=`<div class="title"><span>${item.icon} ${item.name}</span><span style="font-size:7px;color:#a6e3a1;">${item.done}/${item.total} (${item.pct}%)</span></div><div class="desc">📝 ${item.dm}/${item.cm} prácticas | 🧪 ${item.dl}/${item.cl} labs</div>`;
            div.onclick=()=>filterContent(item.id);
        }else if(item.type==='lab'){
            const done=ST.lDone.has(item.id);
            div.className='lab-item'+(done?' done':'');
            div.innerHTML=`<div class="title"><span>${item.title}</span>${done?'<span style="color:#a6e3a1;">✅</span>':''}</div><div class="desc">${item.desc} (${item.catName})</div><div style="color:#a6e3a1;font-size:7px;">⭐ ${item.xp} XP | ${item.dif}</div>`;
            div.onclick=()=>loadLab(item.id);
        }else{
            const isDone=ST.mDone.has(item.id);const isActive=ST.mission===item.id;
            div.className='mission'+(isDone?' done':'')+(isActive?' active':'');
            div.innerHTML=`<div class="title"><span>${item.title}</span>${isDone?'<span style="color:#a6e3a1;">✅</span>':''}</div><div class="desc">${item.desc}</div><div style="color:#a6e3a1;font-size:7px;">+${item.xp} XP</div>`;
            div.onclick=()=>loadMission(item.id);
        }
        list.appendChild(div);
    });
}

function loadMission(id){
    const allM=CATS.flatMap(c=>c.misiones);const m=allM.find(x=>x.id===id);
    if(!m)return;
    ST.mission=id;ST.mdata=m;ST.lab=null;ST.labStep=0;ST.hint=null;ST.cwd='/home/devops';
    const cat=CATS.find(c=>c.misiones.some(x=>x.id===id));if(cat)ST.cat=cat.id;
    document.getElementById('chTitle').textContent='🎯 '+m.title;
    document.getElementById('chDesc').innerHTML=`<strong>📁 ~/practicas/${cat?cat.id:'desconocido'}/</strong><br><br><strong>Misión:</strong> ${m.desc}<br><br><strong>Comando:</strong> <code>${escapeHtml(m.cmd)}</code>`;
    document.getElementById('commandInfo').innerHTML=`<strong>💡 Para qué sirve:</strong><br>${m.ex}`;
    document.getElementById('commandInfo').style.display='block';document.getElementById('hintBtn').style.display='inline-block';
    document.getElementById('labProgress').style.display='none';document.getElementById('backBtn').style.display='none';
    m._hi=0;renderItems();
}

function loadLab(id){
    const allL=CATS.flatMap(c=>c.labs);const lab=allL.find(l=>l.id===id);
    if(!lab)return;
    ST.lab=id;ST.labStep=0;ST.mission=null;ST.mdata=null;ST.hint=null;ST.cwd='/home/devops';
    if(!ST.lSteps[id])ST.lSteps[id]=new Set();
    
    document.getElementById('chTitle').textContent=lab.title;
    document.getElementById('chDesc').innerHTML=`<strong>📁 ~/labs/</strong><br><br><strong>${lab.desc}</strong><br><br><span style="color:#f9e2af;">🎯 Dificultad:</span> ${lab.dif} | <span style="color:#a6e3a1;">⭐ XP:</span> ${lab.xp} | <span style="color:#89b4fa;">📝 Pasos:</span> ${lab.steps.length}`;
    document.getElementById('commandInfo').style.display='none';document.getElementById('hintBtn').style.display='none';
    document.getElementById('backBtn').style.display='inline-block';
    
    // Renderizar progreso del lab
    const pd=document.getElementById('labProgress');pd.style.display='flex';pd.textContent='';
    lab.steps.forEach((step,idx)=>{
        const el=document.createElement('span');el.className='lab-step';
        if(ST.lSteps[id].has(step.id))el.classList.add('done');
        if(idx===ST.labStep)el.classList.add('active');
        el.textContent=`${idx+1}`;
        el.onclick=()=>{ST.labStep=idx;loadLab(id);};
        pd.appendChild(el);
    });
    
    updateLabStep();
    if(ST.labStep===0&&!ST.lSteps[id].has(lab.steps[0].id)){
        print('🧪 Lab iniciado. Sigue los pasos en el panel superior.','info');
    }
    renderItems();
}

function updateLabStep(){
    const allL=CATS.flatMap(c=>c.labs);const lab=allL.find(l=>l.id===ST.lab);
    if(!lab)return;const step=lab.steps[ST.labStep];
    if(step){
        document.getElementById('commandInfo').style.display='block';
        document.getElementById('commandInfo').innerHTML=`<strong>📋 Paso ${ST.labStep+1}/${lab.steps.length}:</strong> ${step.desc}<br><strong>💻 Comando:</strong> <code>${escapeHtml(step.cmd)}</code>`;
        document.getElementById('hintBtn').style.display='inline-block';ST.hint=step.hint;
    }
}

function showHint(){
    if(ST.hint){print(`💡 Pista: ${ST.hint}`,'warn');}
    else if(ST.mdata){const m=ST.mdata;if(m._hi>=m.h.length){print('💡 Ya no hay más pistas.','warn');return;}print(`💡 Pista ${m._hi+1}: ${m.h[m._hi]}`,'warn');m._hi++;}
}

function goBack(){
    ST.lab=null;ST.labStep=0;ST.mission=null;ST.mdata=null;ST.hint=null;ST.cwd='/home/devops';
    document.getElementById('labProgress').style.display='none';document.getElementById('commandInfo').style.display='none';
    document.getElementById('hintBtn').style.display='none';document.getElementById('backBtn').style.display='none';
    document.getElementById('chTitle').textContent='🎯 DevOps Learning Path';
    document.getElementById('chDesc').textContent='11 Módulos | Prácticas + Labs + TS | Autoavance ON';
    filterContent('all');print('\n📋 Volviendo a la vista principal...','info');
}

// ==================== VERIFICACIÓN DE PASOS DE LAB (CORREGIDO v2) ====================
function checkLabStep(cmd){
    if(!ST.lab)return false;
    const allL=CATS.flatMap(c=>c.labs);const lab=allL.find(l=>l.id===ST.lab);
    if(!lab)return false;
    const step=lab.steps[ST.labStep];
    if(!step)return false;
    
    if(cmd.replace(/\s+/g,' ').trim()===step.cmd.replace(/\s+/g,' ').trim()){
        if(!ST.lSteps[ST.lab])ST.lSteps[ST.lab]=new Set();
        ST.lSteps[ST.lab].add(step.id);
        print(`\n✅ ¡Paso ${ST.labStep+1} completado: ${step.desc}!`,'success');
        
        // AVANZAR AL SIGUIENTE PASO
        if(ST.labStep < lab.steps.length - 1){
            ST.labStep++; // Incrementar el paso
            updateLabStep(); // Actualizar panel de información
            updateLabProgress(); // Actualizar barra de progreso
            print(`📋 Siguiente: Paso ${ST.labStep+1}/${lab.steps.length}: ${lab.steps[ST.labStep].desc}`,'info');
        }else{
            completeLab(ST.lab);
        }
        return true;
    }
    return false;
}

// NUEVA FUNCIÓN: Actualizar barra de progreso sin recargar todo
function updateLabProgress(){
    const id=ST.lab;
    const allL=CATS.flatMap(c=>c.labs);const lab=allL.find(l=>l.id===id);
    if(!lab)return;
    
    const pd=document.getElementById('labProgress');
    const steps=pd.querySelectorAll('.lab-step');
    steps.forEach((el,idx)=>{
        el.classList.remove('done','active');
        if(ST.lSteps[id]&&ST.lSteps[id].has(lab.steps[idx].id))el.classList.add('done');
        if(idx===ST.labStep)el.classList.add('active');
    });
}

function completeLab(id){
    const allL=CATS.flatMap(c=>c.labs);const lab=allL.find(l=>l.id===id);
    if(!lab||ST.lDone.has(id))return;
    ST.lDone.add(id);ST.xp+=lab.xp;updateXpDisplay();
    print(`\n🎉 ¡LAB COMPLETADO: ${lab.title}! (+${lab.xp} XP)`,'success');
    showToast(`🏆 ${lab.title} (+${lab.xp} XP)`);
    checkAchievements();saveProgress();renderItems();checkCategoryCompletion();
    
    // Volver a la vista principal después de completar
    setTimeout(()=>{
        document.getElementById('labProgress').style.display='none';
        document.getElementById('commandInfo').style.display='none';
        document.getElementById('hintBtn').style.display='none';
        document.getElementById('backBtn').style.display='none';
        document.getElementById('chTitle').textContent='🎯 DevOps Learning Path';
        document.getElementById('chDesc').textContent='¡Lab completado! Elige otro desafío.';
        ST.lab=null;ST.labStep=0;
        filterContent('all');
    },2000);
}

function checkMission(cmd){
    if(checkLabStep(cmd))return;
    const allM=CATS.flatMap(c=>c.misiones);const m=allM.find(x=>x.cmd===cmd);
    if(!m||ST.mDone.has(m.id))return;
    ST.mDone.add(m.id);ST.xp+=m.xp;updateXpDisplay();
    print(`\n🎉 ¡Misión completada: ${m.title}! (+${m.xp} XP)`,'success');
    showToast(`✅ ${m.title} (+${m.xp} XP)`);
    checkAchievements();saveProgress();renderItems();checkCategoryCompletion();
    if(ST.auto){
        const cat=CATS.find(c=>c.misiones.some(x=>x.id===m.id));
        if(cat){const cm=cat.misiones;const ci=cm.findIndex(x=>x.id===m.id);if(ci<cm.length-1){const nm=cm[ci+1];setTimeout(()=>{print(`\n📋 Siguiente práctica: ${nm.title}`,'info');loadMission(nm.id);},1500);}}
    }
}

function checkCategoryCompletion(){
    const cat=CATS.find(c=>c.id===ST.cat);if(!cat)return;
    const cm=cat.misiones;const allDone=cm.every(m=>ST.mDone.has(m.id));
    if(allDone&&cm.length>0){
        const cl=cat.labs||[];const ld=cl.filter(l=>ST.lDone.has(l.id)).length;
        if(ld<cl.length){
            setTimeout(()=>{print(`\n✅ ¡Completaste todas las prácticas de ${cat.name}!`,'success');print(`📋 ¿Quieres iniciar los labs? (${cl.length-ld} pendientes)`,'warn');print(`💡 Escribe "si" para empezar los labs o "no" para saltar`,'info');ST.waitLab=cat.id;},1000);
        }else{checkNextCategory(cat.id);}
    }
}

function checkNextCategory(catId){
    const cat=CATS.find(c=>c.id===catId);if(!cat||!cat.next)return;
    setTimeout(()=>{print(`\n✅ ¡Completaste ${cat.name} completamente!`,'success');const nc=CATS.find(c=>c.id===cat.next);if(nc){print(`📋 ¿Quieres continuar con ${nc.name}?`,'warn');print(`💡 Escribe "si" para continuar o "no" para quedarte aquí`,'info');ST.waitNext=cat.next;}},1000);
}

function updateXpDisplay(){
    const allM=CATS.flatMap(c=>c.misiones);const allL=CATS.flatMap(c=>c.labs);
    const maxXp=allM.reduce((s,m)=>s+m.xp,0)+allL.reduce((s,l)=>s+l.xp,0);
    document.getElementById('xpFill').style.width=Math.min(100,(ST.xp/maxXp)*100)+'%';
    document.getElementById('totalXpText').textContent=ST.xp;
    document.getElementById('xpText').textContent=`${ST.xp}/${maxXp}`;
}

function showToast(msg,type){
    const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
    t.className=type||'';setTimeout(()=>{t.style.display='none';t.className='';},3000);
}

function getAutocomplete(input){const parts=input.trim().split(/\s+/);const lastPart=parts[parts.length-1]||'';const cmd=parts[0]||'';const sugs=new Set();const BASE=['pwd','ls','ls -la','cd','cd ..','cd /tmp','cd ~','mkdir','touch','cat','cp','mv','rm','rm -rf','rmdir','grep','find','head','tail','echo','chmod','chown','whoami','ps aux','df -h','du -sh','free -h','history','uptime','hostname','clear','help','status','badges','labs','resetprogress','si','no','yes','autoavance','git init','git status','git add','git commit -m','git log','git branch','git checkout -b','git merge','docker run hello-world','docker ps','docker pull','docker build','docker stop','docker logs','kubectl get pods','kubectl run','kubectl describe','kubectl create deployment','kubectl expose','ping -c 4 8.8.8.8','traceroute','netstat -tulpn','dig','curl -I','curl','aws s3 ls','aws s3 mb','aws s3 cp','aws ec2 describe-instances','az login','gcloud auth login','terraform init','terraform plan','terraform apply','ansible all -m ping','ansible-playbook','vault kv put','vault kv get','trivy image','gh workflow list','gh workflow run','gh run watch','promtool check','systemctl status','journalctl','lsof','strace','dmesg','kill'];BASE.forEach(c=>{if(c.startsWith(input)||c.startsWith(lastPart))sugs.add(c);});const fc=['cat','cd','cp','mv','rm','touch','mkdir','ls','head','tail','grep','find'];if(fc.includes(cmd)||parts.length>1){const entries=getEntries(ST.cwd);entries.forEach(e=>{if(e.n.startsWith(lastPart)){const prefix=parts.slice(0,-1).join(' ');sugs.add((prefix?prefix+' ':'')+cmd+' '+e.n+(e.nd.t==='dir'?'/':''));}});}return[...sugs].slice(0,15);}
