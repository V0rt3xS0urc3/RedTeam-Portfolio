{enunciado:"La competencia intraespecífica:",opciones:["Individuos de misma especie compiten por recursos","Distintas especies compiten","No hay competencia","Solo depredación","Solo mutualismo"],correcta:0,solucion:"Densidad-dependiente. Regula tamaño poblacional."},
{enunciado:"El principio de exclusión competitiva:",opciones:["Dos especies con mismo nicho no coexisten","Siempre coexisten","No se afectan","Una siempre se extingue","No existe"],correcta:0,solucion:"Gause: nichos idénticos → una desplaza a la otra."},
{enunciado:"Las especies clave:",opciones:["Efecto desproporcionado en ecosistema respecto a su abundancia","Más abundantes","Menos abundantes","Sin efecto","Solo productores"],correcta:0,solucion:"Estrella de mar (Pisaster). Su remoción altera comunidad."},
{enunciado:"Los ingenieros ecosistémicos:",opciones:["Modifican físicamente el ambiente (castores)","Solo depredan","Solo parasitan","Solo compiten","No afectan"],correcta:0,solucion:"Crean, modifican o destruyen hábitat."},
{enunciado:"La resiliencia ecosistémica:",opciones:["Capacidad de recuperarse tras perturbación","Solo resistencia","Solo estabilidad","Solo diversidad","Solo productividad"],correcta:0,solucion:"Volver al estado original después de disturbio."},
{enunciado:"La resistencia ecosistémica:",opciones:["Capacidad de mantenerse estable durante perturbación","Solo recuperación","Solo diversidad","Solo productividad","Solo biomasa"],correcta:0,solucion:"Permanecer sin cambios ante estrés ambiental."},
{enunciado:"Los puntos de inflexión ecológicos:",opciones:["Umbral donde ecosistema cambia irreversiblemente","Solo máximo","Solo mínimo","Solo promedio","No existen"],correcta:0,solucion:"Tipping points. Cambio de estado repentino."},
{enunciado:"La fragmentación del hábitat:",opciones:["Divide ecosistemas reduciendo biodiversidad","Aumenta biodiversidad","No afecta","Solo beneficia","Es natural siempre"],correcta:0,solucion:"Carreteras, agricultura. Efecto borde. Aislamiento."},
{enunciado:"Los corredores biológicos:",opciones:["Conectan fragmentos de hábitat permitiendo flujo génico","Aíslan poblaciones","No tienen función","Solo para turismo","Solo para agua"],correcta:0,solucion:"Mitigan fragmentación. Conservación."},
{enunciado:"Las áreas protegidas:",opciones:["Conservan biodiversidad in situ","Solo zoológicos","Solo jardines botánicos","Solo bancos de semillas","Solo laboratorios"],correcta:0,solucion:"Parques nacionales, reservas. Protección de ecosistemas."},
{enunciado:"La conservación ex situ:",opciones:["Zoológicos, bancos de semillas, jardines botánicos","Parques nacionales","Reservas naturales","Bosques","Océanos"],correcta:0,solucion:"Fuera del hábitat natural. Complementa conservación in situ."},
{enunciado:"Las especies indicadoras:",opciones:["Reflejan salud del ecosistema (anfibios, líquenes)","Más abundantes","Cualquier especie","Solo depredadores","Solo productores"],correcta:0,solucion:"Sensibles a cambios ambientales."},
{enunciado:"La acidificación oceánica:",opciones:["Disminución de pH por absorción de CO₂","Aumento de pH","No afecta","Solo temperatura","Solo salinidad"],correcta:0,solucion:"CO₂ + H₂O → H₂CO₃. Afecta corales y moluscos."},
{enunciado:"El blanqueamiento de corales:",opciones:["Expulsión de algas simbióticas por estrés térmico","Coloración natural","Crecimiento","Reproducción","Alimentación"],correcta:0,solucion:"Zooxantelas expulsadas. Coral pierde color y muere."},
{enunciado:"Las especies invasoras:",opciones:["Fuera de su rango nativo, causan daño ecológico","Siempre beneficiosas","Solo nativas","No afectan","Solo en jardines"],correcta:0,solucion:"Sin depredadores naturales. Desplazan especies locales."},
{enunciado:"La restauración ecológica:",opciones:["Recuperar ecosistemas degradados","Solo plantar árboles","Solo limpiar agua","Solo proteger animales","No intervenir"],correcta:0,solucion:"Proceso activo de recuperación de estructura y función."},
{enunciado:"La sobreexplotación:",opciones:["Extracción de recursos sobrepasando tasa de renovación","Uso sostenible","Conservación","Protección","Restauración"],correcta:0,solucion:"Pesca excesiva, deforestación. Agota recursos."},
{enunciado:"El tráfico de especies:",opciones:["Comercio ilegal de flora y fauna silvestre","Comercio legal","Solo plantas","Solo insectos","No existe"],correcta:0,solucion:"Amenaza la biodiversidad. CITES regula comercio."},
{enunciado:"El ecoturismo:",opciones:["Turismo responsable que conserva ambiente y beneficia comunidades","Turismo masivo","Solo hoteles","Solo playas","No tiene impacto"],correcta:0,solucion:"Sostenible. Educación ambiental y desarrollo local."},

{enunciado:"El Protocolo de Montreal (1987):",opciones:["Prohibió CFC para proteger capa de ozono","Reguló emisiones de CO₂","Protegió ballenas","Limitó pesca","Controló desechos nucleares"],correcta:0,solucion:"Acuerdo internacional exitoso. Capa de ozono recuperándose."},
{enunciado:"El Acuerdo de París (2015):",opciones:["Limitar calentamiento global a menos de 2°C","Prohibir CFC","Proteger ozono","Controlar ballenas","Regular pesca"],correcta:0,solucion:"Compromisos nacionales de reducción de emisiones."},
{enunciado:"La huella de carbono:",opciones:["Total de gases de efecto invernadero emitidos","Solo CO₂","Solo metano","Solo agua","Solo residuos"],correcta:0,solucion:"Medida de impacto individual o industrial sobre clima."},
{enunciado:"La energía renovable:",opciones:["Solar, eólica, hidroeléctrica, geotérmica, biomasa","Petróleo","Carbón","Gas natural","Nuclear de fisión"],correcta:0,solucion:"Fuentes que se regeneran naturalmente."},
{enunciado:"La economía circular:",opciones:["Reducir, reutilizar, reciclar recursos","Economía lineal","Solo producción","Solo consumo","Solo desecho"],correcta:0,solucion:"Minimiza residuos. Ciclo cerrado de materiales."},
{enunciado:"Los microplásticos:",opciones:["Partículas <5mm que contaminan océanos y organismos","Plásticos grandes","Solo en ríos","Solo en tierra","No contaminan"],correcta:0,solucion:"Ingeridos por fauna marina. Entran en cadena trófica."},
{enunciado:"La desertificación:",opciones:["Degradación de tierras en zonas áridas","Solo desiertos naturales","Solo inundaciones","Solo terremotos","Solo volcanes"],correcta:0,solucion:"Sobrepastoreo, deforestación, cambio climático."},
{enunciado:"La deforestación:",opciones:["Pérdida de bosques por tala, agricultura, urbanización","Solo incendios naturales","Solo plagas","Solo viento","Solo nieve"],correcta:0,solucion:"Reduce biodiversidad, libera CO₂, afecta ciclo del agua."},
{enunciado:"El efecto Allee:",opciones:["Crecimiento poblacional reducido a densidades bajas","Sobrepoblación","Crecimiento exponencial","Capacidad de carga","Extinción masiva"],correcta:0,solucion:"Dificultad para encontrar pareja a bajas densidades."},
{enunciado:"La metapoblación:",opciones:["Conjunto de poblaciones locales conectadas por migración","Población única","Solo en islas","Solo en montañas","No existe"],correcta:0,solucion:"Equilibrio entre extinción local y recolonización."},
// ===== UNIDAD 9: FISIOLOGÍA VEGETAL (401-440) =====
{enunciado:"Las plantas son organismos:",opciones:["Autótrofos fotosintéticos","Heterótrofos","Quimiosintéticos","Parásitos obligados","Saprófitos"],correcta:0,solucion:"Producen su alimento mediante fotosíntesis."},
{enunciado:"La clorofila absorbe principalmente luz:",opciones:["Roja y azul","Verde","Amarilla","Ultravioleta","Infrarroja"],correcta:0,solucion:"Refleja verde (por eso vemos hojas verdes)."},
{enunciado:"Los estomas:",opciones:["Poros en hojas para intercambio gaseoso","Raíces","Flores","Frutos","Semillas"],correcta:0,solucion:"Células oclusivas regulan apertura. Entra CO₂, sale O₂ y H₂O."},
{enunciado:"La transpiración vegetal:",opciones:["Pérdida de agua por estomas","Absorción de agua","Producción de oxígeno","Fijación de nitrógeno","Síntesis de glucosa"],correcta:0,solucion:"Crea gradiente que impulsa absorción de agua por raíces."},
{enunciado:"El xilema transporta:",opciones:["Agua y minerales desde raíz a hojas","Savía elaborada","Hormonas","Solo oxígeno","Solo CO₂"],correcta:0,solucion:"Tejido conductor. Células muertas (traqueidas, vasos)."},
{enunciado:"El floema transporta:",opciones:["Savía elaborada (azúcares) desde hojas a tejidos","Agua y minerales","Solo hormonas","Solo oxígeno","Solo CO₂"],correcta:0,solucion:"Tejido conductor vivo. Células cribosas."},
{enunciado:"La raíz primaria:",opciones:["Ancla planta y absorbe agua y nutrientes","Realiza fotosíntesis","Produce flores","Almacena solo azúcares","No tiene función"],correcta:0,solucion:"Con pelos absorbentes que aumentan superficie."},
{enunciado:"Las micorrizas:",opciones:["Asociación simbiótica hongo-raíz","Parasitismo","Solo en hojas","Solo en flores","No existen"],correcta:0,solucion:"Hongos aumentan absorción de agua y fósforo."},
{enunciado:"La fijación biológica de nitrógeno:",opciones:["Bacterias en nódulos de leguminosas convierten N₂ en amonio","Fotosíntesis","Respiración","Transpiración","Germinación"],correcta:0,solucion:"Rhizobium. Simbiosis mutualista."},
{enunciado:"Las hormonas vegetales (fitohormonas):",opciones:["Regulan crecimiento y desarrollo","Solo fotosíntesis","Solo respiración","Solo color","Solo sabor"],correcta:0,solucion:"Auxinas, giberelinas, citoquininas, etileno, ABA."},
{enunciado:"Las auxinas:",opciones:["Promueven elongación celular y dominancia apical","Inhiben crecimiento","Maduran frutos","Cierran estomas","Germinan semillas"],correcta:0,solucion:"Fototropismo y gravitropismo."},
{enunciado:"Las giberelinas:",opciones:["Estimulan crecimiento del tallo y germinación","Inhiben crecimiento","Cierran estomas","Maduran frutos","Defensa"],correcta:0,solucion:"Alargamiento de entrenudos. Superan enanismo."},
{enunciado:"Las citoquininas:",opciones:["Promueven división celular y retrasan senescencia","Inhiben división","Cierran estomas","Maduran frutos","Defensa"],correcta:0,solucion:"En raíces. Transportadas por xilema."},
{enunciado:"El etileno:",opciones:["Hormona gaseosa que madura frutos y senescencia","Solo crecimiento","Solo división","Solo fotosíntesis","Solo defensa"],correcta:0,solucion:"'Hormona del estrés'. Maduración climatérica."},
{enunciado:"El ácido abscísico (ABA):",opciones:["Induce dormancia y cierre de estomas en sequía","Promueve crecimiento","Madura frutos","Germina semillas","Alarga tallos"],correcta:0,solucion:"Respuesta a estrés hídrico."},
{enunciado:"El fototropismo:",opciones:["Crecimiento hacia la luz","Hacia la gravedad","Hacia el agua","Hacia el tacto","Sin dirección"],correcta:0,solucion:"Auxinas se redistribuyen al lado oscuro."},
{enunciado:"El gravitropismo:",opciones:["Crecimiento en respuesta a gravedad","Hacia la luz","Hacia el agua","Hacia el tacto","Aleatorio"],correcta:0,solucion:"Raíz: positivo (hacia abajo). Tallo: negativo (hacia arriba)."},
{enunciado:"La polinización:",opciones:["Transferencia de polen de antera a estigma","Fecundación","Germinación","Fotosíntesis","Respiración"],correcta:0,solucion:"Puede ser anemófila (viento), entomófila (insectos), etc."},
{enunciado:"La doble fecundación en angiospermas:",opciones:["Forma cigoto y endospermo triploide","Solo cigoto","Solo endospermo","No ocurre","Solo en gimnospermas"],correcta:0,solucion:"Un núcleo espermático + oósfera = cigoto. Otro + núcleos polares = endospermo."},
{enunciado:"El fruto:",opciones:["Ovario maduro que protege semillas","Raíz","Tallo","Hoja","Flor"],correcta:0,solucion:"Desarrollado tras fecundación."},
{enunciado:"La germinación:",opciones:["Reinicio del crecimiento del embrión en semilla","Fotosíntesis","Respiración","Floración","Fructificación"],correcta:0,solucion:"Requiere agua, oxígeno y temperatura adecuada."},
{enunciado:"Las plantas C3:",opciones:["Fijan CO₂ directamente en Ciclo de Calvin","Usan vía C4","Son CAM","No hacen fotosíntesis","Solo respiran"],correcta:0,solucion:"Mayoría de plantas. Fotorrespiración en calor."},
{enunciado:"Las plantas C4:",opciones:["Separan espacialmente fijación de CO₂ y Ciclo de Calvin","Son C3","Son CAM","No hacen fotosíntesis","Solo acuáticas"],correcta:0,solucion:"Maíz, caña de azúcar. Más eficientes en calor."},
{enunciado:"Las plantas CAM:",opciones:["Abren estomas de noche (cactus, suculentas)","Siempre abiertos","Nunca abren","Solo de día","No tienen estomas"],correcta:0,solucion:"Metabolismo ácido de crasuláceas. Ahorran agua."},
{enunciado:"Los tropismos:",opciones:["Respuestas de crecimiento direccional","Movimientos rápidos","Solo en animales","No existen","Solo en raíces"],correcta:0,solucion:"Fototropismo, gravitropismo, tigmotropismo."},
{enunciado:"Las nastias:",opciones:["Movimientos no direccionales (Mimosa púdica)","Crecimiento direccional","Solo en raíces","No existen","Solo fototropismo"],correcta:0,solucion:"Respuesta rápida independiente de dirección del estímulo."},
{enunciado:"El fotoperíodo:",opciones:["Duración del día que afecta floración","Intensidad lumínica","Color de luz","Temperatura","Humedad"],correcta:0,solucion:"Plantas de día corto, día largo o neutras."},
{enunciado:"Las plantas de día corto:",opciones:["Florecen cuando noche supera cierto umbral","Día largo","Neutras","No florecen","Siempre florecen"],correcta:0,solucion:"Crisantemos, poinsettias. Fitocromo detecta."},
{enunciado:"El fitocromo:",opciones:["Fotorreceptor que detecta luz roja y roja lejana","Hormona","Enzima","Nutriente","Pigmento fotosintético"],correcta:0,solucion:"Regula germinación, floración, fotomorfogénesis."},
{enunciado:"La partenocarpia:",opciones:["Desarrollo de frutos sin fecundación (banano)","Con semillas","Solo en cítricos","No existe","Solo en uvas"],correcta:0,solucion:"Frutos sin semillas. Inducido por auxinas."},
// ===== UNIDAD 10: GENÉTICA MOLECULAR AVANZADA (441-480) =====
{enunciado:"Los telómeros:",opciones:["Extremos de cromosomas que se acortan con cada división","Centro del cromosoma","Genes","Proteínas","Orgánulos"],correcta:0,solucion:"Secuencias TTAGGG. Relacionados con envejecimiento."},
{enunciado:"La telomerasa:",opciones:["Alarga telómeros en células madre y germinales","Acorta telómeros","Corta ADN","Sintetiza proteínas","Degrada ARN"],correcta:0,solucion:"Ribonucleoproteína. Activa en cáncer."},
{enunciado:"Los operones:",opciones:["Conjuntos de genes regulados coordinadamente en procariotas","Genes eucariotas","Proteínas","Lípidos","Orgánulos"],correcta:0,solucion:"Operón lac: gen regulador, promotor, operador, genes estructurales."},
{enunciado:"El operón lac:",opciones:["Genes para metabolismo de lactosa en E. coli","Síntesis de triptófano","Reparación de ADN","División celular","Fotosíntesis"],correcta:0,solucion:"Inducible: lactosa induce su expresión."},
{enunciado:"El operón trp:",opciones:["Genes para síntesis de triptófano","Degradación de lactosa","Fotosíntesis","Respiración","División"],correcta:0,solucion:"Reprimible: triptófano reprime su expresión."},
{enunciado:"Los factores de transcripción:",opciones:["Proteínas que regulan expresión génica uniéndose a ADN","ARN","Lípidos","Carbohidratos","Enzimas digestivas"],correcta:0,solucion:"Activan o reprimen transcripción de genes específicos."},
{enunciado:"Los enhancers (potenciadores):",opciones:["Secuencias de ADN que aumentan transcripción a distancia","Inhiben transcripción","Solo en procariotas","No existen","Solo en virus"],correcta:0,solucion:"Pueden estar lejos del gen que regulan."},
{enunciado:"Los silenciadores:",opciones:["Secuencias que reprimen transcripción génica","Activan transcripción","Solo en procariotas","No existen","Solo en plantas"],correcta:0,solucion:"Proteínas represoras se unen a ellos."},
{enunciado:"El splicing alternativo:",opciones:["Un mismo gen produce diferentes ARNm y proteínas","Solo un ARNm","No existe","Solo en bacterias","Solo en virus"],correcta:0,solucion:"Exones combinados de distintas formas."},
{enunciado:"Los intrones:",opciones:["Secuencias no codificantes removidas del ARNm","Exones","Codificantes","Proteínas","Promotores"],correcta:0,solucion:"Eliminados durante maduración del ARNm."},
{enunciado:"Los exones:",opciones:["Secuencias codificantes que permanecen en ARNm maduro","Intrones","No codificantes","Promotores","Operadores"],correcta:0,solucion:"Forman el ARN mensajero maduro."},
{enunciado:"El código genético es:",opciones:["Degenerado (varios codones para un aminoácido)","No degenerado","Ambiguo","Único por especie","Solo para humanos"],correcta:0,solucion:"64 codones, 20 aminoácidos. Universal."},
{enunciado:"Los ribosomas 80S:",opciones:["Eucariotas (subunidades 60S y 40S)","Procariotas","Mitocondriales","Cloroplastos","Virales"],correcta:0,solucion:"Sitio de traducción en células eucariotas."},
{enunciado:"Los ribosomas 70S:",opciones:["Procariotas, mitocondrias y cloroplastos","Eucariotas","Solo núcleo","Solo virus","No existen"],correcta:0,solucion:"Evidencia de origen endosimbiótico."},
{enunciado:"La mutación sin sentido:",opciones:["Genera codón de terminación prematuro","Cambia aminoácido","No cambia aminoácido","Duplica gen","Invierte secuencia"],correcta:0,solucion:"STOP prematuro: proteína truncada."},
{enunciado:"La mutación de cambio de sentido:",opciones:["Cambia un aminoácido por otro","No cambia aminoácido","Genera STOP","Duplica","Invierte"],correcta:0,solucion:"Puede afectar función proteica."},
{enunciado:"La mutación silenciosa:",opciones:["No cambia aminoácido por degeneración del código","Cambia aminoácido","Genera STOP","Duplica gen","Elimina gen"],correcta:0,solucion:"Mismo aminoácido. Sin efecto fenotípico."},
{enunciado:"La mutación por corrimiento del marco de lectura:",opciones:["Inserción/deleción que no es múltiplo de 3","Sustitución","Silenciosa","Sin sentido","De cambio de sentido"],correcta:0,solucion:"Altera toda la proteína desde la mutación."},
{enunciado:"Los agentes mutagénicos:",opciones:["Radiación UV, rayos X, químicos (benzopireno)","Solo agua","Solo oxígeno","Solo CO₂","Solo nutrientes"],correcta:0,solucion:"Aumentan tasa de mutación."},
{enunciado:"La reparación por escisión de nucleótidos:",opciones:["Repara dímeros de timina inducidos por UV","Solo roturas doble hebra","Solo mismatch","No existe","Solo en ARN"],correcta:0,solucion:"Xeroderma pigmentoso: defecto en esta reparación."},
// ===== UNIDAD 11: MICROBIOLOGÍA (481-520) =====
{enunciado:"Las bacterias Gram positivas:",opciones:["Pared gruesa de peptidoglicano, se tiñen violeta","Pared delgada, membrana externa","Sin pared","Con clorofila","Con núcleo"],correcta:0,solucion:"Tinción de Gram: cristal violeta retenido."},
{enunciado:"Las bacterias Gram negativas:",opciones:["Pared delgada, membrana externa con LPS, se tiñen rosa","Pared gruesa","Sin pared","Con clorofila","Con núcleo"],correcta:0,solucion:"Lipopolisacárido (endotoxina). Resistencia a antibióticos."},
{enunciado:"Los antibióticos betalactámicos:",opciones:["Inhiben síntesis de pared celular (penicilina)","Inhiben síntesis proteica","Bloquean ADN","Inhiben ARN","Atacan membrana"],correcta:0,solucion:"Penicilina, amoxicilina. Inhiben transpeptidasa."},
{enunciado:"Los antibióticos aminoglucósidos:",opciones:["Inhiben síntesis proteica uniéndose a ribosoma 70S","Pared celular","Síntesis de ADN","Membrana","ARN polimerasa"],correcta:0,solucion:"Estreptomicina, gentamicina. Bactericidas."},
{enunciado:"Las tetraciclinas:",opciones:["Inhiben síntesis proteica (ribosoma 70S)","Pared celular","ADN","Membrana","ARN"],correcta:0,solucion:"Bacteriostáticos de amplio espectro."},
{enunciado:"La conjugación bacteriana:",opciones:["Transferencia de ADN por pili sexual","Transformación","Transducción","Fisión binaria","Esporulación"],correcta:0,solucion:"Plásmido F. Resistencia a antibióticos."},
{enunciado:"La transformación bacteriana:",opciones:["Captación de ADN libre del ambiente","Pili sexual","Virus","Fisión","Espora"],correcta:0,solucion:"Bacterias competentes captan ADN exógeno."},
{enunciado:"La transducción bacteriana:",opciones:["Transferencia de ADN por bacteriófagos","Pili","ADN libre","Fisión","Espora"],correcta:0,solucion:"Fagos transportan ADN bacteriano entre células."},
{enunciado:"Los plásmidos de resistencia:",opciones:["Contienen genes de resistencia a antibióticos","Solo replicación","Solo metabolismo","Solo color","No existen"],correcta:0,solucion:"Transmisibles entre bacterias."},
{enunciado:"Las endosporas bacterianas:",opciones:["Estructuras de resistencia a calor, radiación, químicos","Reproducción","Nutrición","Movimiento","Comunicación"],correcta:0,solucion:"Clostridium, Bacillus. Sobreviven condiciones extremas."},
{enunciado:"Los hongos son:",opciones:["Eucariotas heterótrofos con pared de quitina","Procariotas","Autótrofos","Sin pared","Con clorofila"],correcta:0,solucion:"Levaduras (unicelulares) y mohos (filamentosos)."},
{enunciado:"Las levaduras:",opciones:["Hongos unicelulares (Saccharomyces cerevisiae)","Mohos","Bacterias","Algas","Virus"],correcta:0,solucion:"Fermentación. Modelo eucariota en investigación."},
{enunciado:"Los antibióticos antifúngicos:",opciones:["Atacan ergosterol de membrana fúngica","Pared bacteriana","Ribosomas 70S","ADN bacteriano","Cápside viral"],correcta:0,solucion:"Anfotericina B, fluconazol."},
{enunciado:"Los protozoos:",opciones:["Eucariotas unicelulares heterótrofos","Bacterias","Hongos","Algas","Virus"],correcta:0,solucion:"Amebas, paramecios, Plasmodium."},
{enunciado:"La malaria es causada por:",opciones:["Plasmodium (protozoo transmitido por Anopheles)","Virus","Bacteria","Hongo","Prión"],correcta:0,solucion:"Invade glóbulos rojos. Fiebre, anemia."},
{enunciado:"Los virus:",opciones:["Parásitos intracelulares obligados (no son células)","Bacterias","Hongos","Protozoos","Algas"],correcta:0,solucion:"Cápside proteica + material genético (ADN o ARN)."},

function estimarPuntajePAES(pct){
  if(pct>=98)return 1000;
  if(pct>=95)return Math.round(950+(pct-95)*10);
  if(pct>=85)return Math.round(800+(pct-85)*15);
  if(pct>=75)return Math.round(700+(pct-75)*10);
  if(pct>=60)return Math.round(600+(pct-60)*6.67);
  if(pct>=45)return Math.round(500+(pct-45)*6.67);
  if(pct>=30)return Math.round(400+(pct-30)*6.67);
  if(pct>=15)return Math.round(250+(pct-15)*10);
  return Math.round(100+(pct/15)*150);
}

function barajar(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function barajarOpciones(pregunta){
  const letras = ['A','B','C','D','E'];
  const opcionesConIndice = pregunta.opciones.map((op, i) => ({texto: op, indiceOriginal: i}));
  for(let i = opcionesConIndice.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [opcionesConIndice[i], opcionesConIndice[j]] = [opcionesConIndice[j], opcionesConIndice[i]];
  }
  const nuevaCorrecta = opcionesConIndice.findIndex(op => op.indiceOriginal === pregunta.correcta);
  return {
    opciones: opcionesConIndice.map(op => op.texto),
    correcta: nuevaCorrecta
  };
}

    disp=[...bancoBio];
  }
  const sel=barajar([...disp]).slice(0,65);
  prev.push(sel.map(p=>bancoBio.indexOf(p)));
  localStorage.setItem('v3s_bio_650',JSON.stringify(prev));
  preguntasExamen = sel.map(p => {
  const barajada = barajarOpciones(p);
  return {
    enunciado: p.enunciado,
    opciones: barajada.opciones,
    correcta: barajada.correcta,
    solucion: p.solucion
  };
});
respuestas=new Array(65).fill(null);indice=0;finalizado=false;intentoActual=prev.length;renderizar();
}

function seleccionar(idx){if(!finalizado){respuestas[indice]=idx;renderizar();}}
function navegar(d){const n=indice+d;if(n>=0&&n<65){indice=n;renderizar();}}
function finalizar(){finalizado=true;renderizar();}
function volverInicio(){preguntasExamen=[];respuestas=new Array(65).fill(null);indice=0;finalizado=false;renderizar();}
function calcular(){let c=0;preguntasExamen.forEach((p,i)=>{if(respuestas[i]===p.correcta)c++;});return{correctas:c,total:65};}

function renderizar(){
  const app=document.getElementById('contenidoDinamico');
  const prev=JSON.parse(localStorage.getItem('v3s_bio_650')||'[]');
  const usados=prev.length;
  if(!preguntasExamen.length){
    app.innerHTML=`<div style="text-align:center;"><p class="intentos-info">🎯 Intentos: <strong>${usados}</strong> de <strong>10</strong></p><p style="margin:1.2rem 0;font-size:1.05rem;">📚 <strong>650 preguntas únicas</strong> · 10 intentos sin repetición<br>🧬 Célula · Genética · Evolución · Ecología · Fisiología · Inmunología</p><button onclick="window.iniciarExamen()" style="font-size:1.15rem;padding:0.9rem 2.8rem;background:#2d5a2d;color:white;border-color:#1a3c1a;cursor:pointer;">▶ Iniciar intento ${usados+1}</button>${usados>=10?'<p style="color:#c0392b;margin-top:1rem;">⚠️ Límite alcanzado.</p>':''}${usados>0&&usados<10?`<p style="color:#5a7a5a;margin-top:0.8rem;">Te quedan <strong>${10-usados}</strong> intento(s).</p>`:''}</div>`;
    return;
  }
  if(finalizado){
    const{correctas}=calcular();
    const pct=Math.round((correctas/65)*100);
    const puntaje=estimarPuntajePAES(pct);
    let nivel='',cn='';
    if(puntaje>=800){nivel='🏅 Dominio excepcional de Biología';cn='#27ae60';}
    else if(puntaje>=650){nivel='📘 Buen conocimiento científico';cn='#2c3e50';}
    else if(puntaje>=500){nivel='📗 En desarrollo';cn='#f39c12';}
    else{nivel='📕 Necesita reforzar contenidos';cn='#c0392b';}
    app.innerHTML=`<div class="resultado-final"><h2>📋 Resultado Biología · Intento ${intentoActual} de 10</h2><p class="puntaje-etiqueta">PUNTAJE PAES ESTIMADO</p><p class="puntaje-paes">${puntaje}</p><p>de 1000 puntos máximos</p><div class="barra-puntaje"><div class="barra-puntaje-lleno" style="width:${((puntaje-100)/900)*100}%;"></div></div><p>${correctas}/65 (${pct}%)</p><p style="color:${cn};font-weight:600;">${nivel}</p><div style="max-height:350px;overflow-y:auto;text-align:left;margin:1.2rem 0;">${preguntasExamen.map((p,i)=>{const u=respuestas[i];const ok=u===p.correcta;const lu=u!==null?String.fromCharCode(65+u):'—';const lc=String.fromCharCode(65+p.correcta);return`<div class="solucion-item" style="background:${ok?'#d8f0d8':'#f0ddd8'};border-left:3px solid ${ok?'#4caf50':'#e5735a'};"><strong>${i+1}.</strong> ${p.enunciado.substring(0,60)}...<br>🔹 Tu: <strong>${lu}</strong> | ✅: <strong>${lc}</strong><br>📘 ${p.solucion}</div>`;}).join('')}</div><button onclick="window.volverInicio()">↩️ Volver al inicio</button></div>`;
    return;
  }
  const p=preguntasExamen[indice];
  const letras=['A','B','C','D','E'];
  const resp=respuestas.filter(r=>r!==null).length;
  app.innerHTML=`<p class="intentos-info">📝 Intento ${intentoActual} de 10 · Respondidas: ${resp}/65</p><div class="barra-progreso"><div class="progreso-lleno" style="width:${((indice+1)/65)*100}%;"></div></div><div class="pregunta-box"><div class="numero-pregunta">Pregunta ${indice+1} de 65</div><div class="enunciado">${p.enunciado}</div><div class="opciones">${p.opciones.map((op,i)=>`<div class="opcion ${respuestas[indice]===i?'seleccionada':''}" onclick="window.seleccionar(${i})"><span class="letra">${letras[i]}</span> <span style="flex:1;">${op}</span>${respuestas[indice]===i?'<span style="color:#2d5a2d;">✓</span>':''}</div>`).join('')}</div></div><div class="navegacion"><button ${indice===0?'disabled':''} onclick="window.navegar(-1)">← Anterior</button><span style="font-weight:600;">${indice+1}/65</span><button ${indice===64?'disabled':''} onclick="window.navegar(1)">Siguiente →</button></div><div style="text-align:right;margin-top:1.5rem;"><button class="btn-finalizar" onclick="window.finalizar()">✅ Finalizar intento</button></div>`;
}

window.iniciarExamen=iniciarExamen;
window.seleccionar=seleccionar;
window.navegar=navegar;
window.finalizar=finalizar;
window.volverInicio=volverInicio;
renderizar();
})();
</script>
</body>
</html>
