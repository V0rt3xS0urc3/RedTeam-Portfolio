// ============ SISTEMA DE 10 INTENTOS ============
function estimarPuntajePAES(pct){
  if(pct>=98)return 1000;
  if(pct>=95)return Math.round(950+(pct-95)*10);
  if(pct>=85)return Math.round(800+(pct-85)*15);
  if(pct>=75)return Math.round(700+(pct-75)*10);
  if(pct>=60)return Math.round(600+(pct-60)*6.67);
  if(pct>=45)return Math.round(500+(pct-45)*6.67);
  if(pct>=30)return Math.round(400+(pct-30)*6.67);
  if(pct>=15)return Math.round(250+(pct-15)*10);
  return Math.round(100+(pct/15)*150);
}

let preguntasExamen=[], respuestas=new Array(65).fill(null), indice=0, finalizado=false, intentoActual=0;

function barajar(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function barajarOpciones(pregunta){
  const letras = ['A','B','C','D','E'];
  const opcionesConIndice = pregunta.opciones.map((op, i) => ({texto: op, indiceOriginal: i}));
  for(let i = opcionesConIndice.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [opcionesConIndice[i], opcionesConIndice[j]] = [opcionesConIndice[j], opcionesConIndice[i]];
  }
  const nuevaCorrecta = opcionesConIndice.findIndex(op => op.indiceOriginal === pregunta.correcta);
  return {
    opciones: opcionesConIndice.map(op => op.texto),
    correcta: nuevaCorrecta
  };

function iniciarExamen(){
  const prev=JSON.parse(localStorage.getItem('v3s_m2_650')||'[]');
  if(prev.length>=10){
    if(confirm('⚠️ Ya usaste los 10 intentos. ¿Reiniciar historial para 10 más?')){
      localStorage.setItem('v3s_m2_650','[]');
    }else return;
  }
  const usadas=new Set(prev.flat());
  let disp=bancoM2.filter((_,i)=>!usadas.has(i));
  if(disp.length<65){
    alert('🔄 Banco agotado. Reiniciando historial automáticamente.');
    localStorage.setItem('v3s_m2_650','[]');
    disp=[...bancoM2];
  }
  const sel=barajar([...disp]).slice(0,65);
  prev.push(sel.map(p=>bancoM2.indexOf(p)));
  localStorage.setItem('v3s_m2_650',JSON.stringify(prev));
  preguntasExamen = sel.map(p => {
  const barajada = barajarOpciones(p);
  return {
    enunciado: p.enunciado,
    opciones: barajada.opciones,
    correcta: barajada.correcta,
    solucion: p.solucion
  };
});
respuestas=new Array(65).fill(null);indice=0;finalizado=false;intentoActual=prev.length;renderizar();
}

function seleccionar(idx){if(!finalizado){respuestas[indice]=idx;renderizar();}}
function navegar(d){const n=indice+d;if(n>=0&&n<65){indice=n;renderizar();}}
function finalizar(){finalizado=true;renderizar();}
function volverInicio(){preguntasExamen=[];respuestas=new Array(65).fill(null);indice=0;finalizado=false;renderizar();}
function calcular(){let c=0;preguntasExamen.forEach((p,i)=>{if(respuestas[i]===p.correcta)c++;});return{correctas:c,total:65};}

function renderizar(){
  const app=document.getElementById('contenidoDinamico');
  const prev=JSON.parse(localStorage.getItem('v3s_m2_650')||'[]');
  const usados=prev.length;
  if(!preguntasExamen.length){
    app.innerHTML=`<div style="text-align:center;"><p class="intentos-info">🎯 Intentos: <strong>${usados}</strong> de <strong>10</strong></p><p style="margin:1.2rem 0;font-size:1.05rem;">📚 <strong>650 preguntas únicas</strong> · 10 intentos sin repetición<br>📊 Álgebra avanzada, Cálculo, Probabilidad, Geometría Analítica</p><button onclick="window.iniciarExamen()" style="font-size:1.15rem;padding:0.9rem 2.8rem;background:#1a3c5e;color:white;border-color:#0f2a40;cursor:pointer;">▶ Iniciar intento ${usados+1}</button>${usados>=10?'<p style="color:#c0392b;margin-top:1rem;">⚠️ Límite de 10 intentos alcanzado.</p>':''}${usados>0&&usados<10?`<p style="color:#6b7d8e;margin-top:0.8rem;">Te quedan <strong>${10-usados}</strong> intento(s).</p>`:''}</div>`;
    return;
  }
  if(finalizado){
    const{correctas}=calcular();
    const pct=Math.round((correctas/65)*100);
    const puntaje=estimarPuntajePAES(pct);
    let nivel='',cn='';
    if(puntaje>=800){nivel='🏅 Puntaje destacado';cn='#27ae60';}
    else if(puntaje>=650){nivel='📘 Buen desempeño';cn='#2c3e50';}
    else if(puntaje>=500){nivel='📗 En desarrollo';cn='#f39c12';}
    else{nivel='📕 Necesita refuerzo';cn='#c0392b';}
    app.innerHTML=`<div class="resultado-final"><h2>📋 Resultado M2 · Intento ${intentoActual} de 10</h2><p class="puntaje-etiqueta">PUNTAJE PAES ESTIMADO</p><p class="puntaje-paes">${puntaje}</p><p>de 1000 puntos máximos</p><div class="barra-puntaje"><div class="barra-puntaje-lleno" style="width:${((puntaje-100)/900)*100}%;"></div></div><p>${correctas}/65 (${pct}%)</p><p style="color:${cn};font-weight:600;">${nivel}</p><div style="max-height:350px;overflow-y:auto;text-align:left;margin:1.2rem 0;">${preguntasExamen.map((p,i)=>{const u=respuestas[i];const ok=u===p.correcta;const lu=u!==null?String.fromCharCode(65+u):'—';const lc=String.fromCharCode(65+p.correcta);return`<div class="solucion-item" style="background:${ok?'#d4edda':'#f8d7da'};border-left:3px solid ${ok?'#4caf50':'#e53935'};"><strong>${i+1}.</strong> ${p.enunciado.substring(0,60)}...<br>🔹 Tu: <strong>${lu}</strong> | ✅: <strong>${lc}</strong><br>📘 ${p.solucion}</div>`;}).join('')}</div><button onclick="window.volverInicio()">↩️ Volver al inicio</button></div>`;
    return;
  }
  const p=preguntasExamen[indice];
  const letras=['A','B','C','D','E'];
  const resp=respuestas.filter(r=>r!==null).length;
  app.innerHTML=`<p class="intentos-info">📝 Intento ${intentoActual} de 10 · Respondidas: ${resp}/65</p><div class="barra-progreso"><div class="progreso-lleno" style="width:${((indice+1)/65)*100}%;"></div></div><div class="pregunta-box"><div class="numero-pregunta">Pregunta ${indice+1} de 65</div><div class="enunciado">${p.enunciado}</div><div class="opciones">${p.opciones.map((op,i)=>`<div class="opcion ${respuestas[indice]===i?'seleccionada':''}" onclick="window.seleccionar(${i})"><span class="letra">${letras[i]}</span> <span style="flex:1;">${op}</span>${respuestas[indice]===i?'<span style="color:#3a7ca5;">✓</span>':''}</div>`).join('')}</div></div><div class="navegacion"><button ${indice===0?'disabled':''} onclick="window.navegar(-1)">← Anterior</button><span style="font-weight:600;">${indice+1}/65</span><button ${indice===64?'disabled':''} onclick="window.navegar(1)">Siguiente →</button></div><div style="text-align:right;margin-top:1.5rem;"><button class="btn-finalizar" onclick="window.finalizar()">✅ Finalizar intento</button></div>`;
}

window.iniciarExamen=iniciarExamen;
window.seleccionar=seleccionar;
window.navegar=navegar;
window.finalizar=finalizar;
window.volverInicio=volverInicio;
renderizar();
})();
</script>
