{texto:"La economía chilena depende significativamente del cobre, que representa aproximadamente el 50% de sus exportaciones. Chile es el mayor productor mundial de este metal, esencial para la electrificación y las energías renovables. La nacionalización del cobre en 1971 creó CODELCO, la mayor empresa cuprífera del mundo. Los precios del cobre fluctúan según la demanda global, afectando la economía nacional.",enunciado:"¿Qué porcentaje de las exportaciones chilenas representa el cobre?",opciones:["Aproximadamente 50%","25%","75%","10%","90%"],correcta:0,solucion:"El texto menciona 'representa aproximadamente el 50% de sus exportaciones'."},

{texto:"Los arrecifes de coral son ecosistemas marinos de extraordinaria biodiversidad. Ocupan menos del 1% del fondo oceánico pero albergan el 25% de las especies marinas. El blanqueamiento de corales, causado por el aumento de temperatura del agua, amenaza su supervivencia. La Gran Barrera de Coral australiana ha sufrido seis eventos de blanqueamiento masivo desde 1998.",enunciado:"¿Qué porcentaje de especies marinas albergan los corales?",opciones:["25%","50%","10%","75%","5%"],correcta:0,solucion:"El texto indica 'albergan el 25% de las especies marinas'."},

{texto:"La fotografía ha evolucionado desde las cámaras oscuras del Renacimiento hasta los smartphones actuales. La primera fotografía permanente fue tomada por Nicéphore Niépce en 1826. El daguerrotipo popularizó el retrato fotográfico en el siglo XIX. Hoy, la inteligencia artificial puede generar imágenes fotorrealistas que desafían nuestra noción de realidad.",enunciado:"¿Quién tomó la primera fotografía permanente?",opciones:["Nicéphore Niépce","Daguerre","Edison","Tesla","Da Vinci"],correcta:0,solucion:"El texto menciona 'la primera fotografía permanente fue tomada por Nicéphore Niépce en 1826'."},

{texto:"El ajedrez es considerado un deporte mental que ejercita la memoria, la estrategia y la concentración. Originado en la India hace más de 1,500 años, se difundió por Persia y Europa. En 1997, la computadora Deep Blue venció al campeón mundial Garry Kasparov, marcando un hito en la inteligencia artificial. Hoy, los programas de ajedrez superan ampliamente a los humanos.",enunciado:"¿Dónde se originó el ajedrez?",opciones:["India","China","Egipto","Grecia","Roma"],correcta:0,solucion:"El texto indica 'originado en la India hace más de 1,500 años'."},

{texto:"La microbiología estudia organismos microscópicos como bacterias, virus, hongos y protozoos. Louis Pasteur demostró que los microorganismos causan enfermedades, refutando la generación espontánea. La pasteurización, técnica que lleva su nombre, elimina patógenos de alimentos sin alterar su sabor. Los microorganismos también tienen usos beneficiosos en la producción de yogur, pan y antibióticos.",enunciado:"¿Qué demostró Louis Pasteur?",opciones:["Los microorganismos causan enfermedades","La generación espontánea existe","Los virus no existen","Las bacterias son plantas","Los hongos son animales"],correcta:0,solucion:"El texto dice 'demostró que los microorganismos causan enfermedades, refutando la generación espontánea'."},

{texto:"El plástico revolucionó la industria en el siglo XX por su versatilidad y bajo costo. Sin embargo, su durabilidad se convirtió en un problema ambiental: tarda cientos de años en degradarse. Cada año llegan a los océanos 8 millones de toneladas de plástico. La isla de basura del Pacífico tiene una superficie tres veces mayor que Francia.",enunciado:"¿Cuánto plástico llega anualmente a los océanos?",opciones:["8 millones de toneladas","1 millón","100 millones","500 mil","50 millones"],correcta:0,solucion:"El texto menciona 'cada año llegan a los océanos 8 millones de toneladas de plástico'."},

{texto:"La música clásica india tiene una tradición de más de 2,000 años. Se divide en dos ramas principales: la música carnática del sur y la indostánica del norte. Utiliza escalas melódicas (ragas) y ciclos rítmicos (talas) diferentes a la música occidental. Instrumentos como el sitar y la tabla son emblemáticos de esta tradición.",enunciado:"¿Cómo se llaman las escalas melódicas indias?",opciones:["Ragas","Talas","Sitars","Tablas","Mantras"],correcta:0,solucion:"El texto señala 'utiliza escalas melódicas (ragas)'."},

{texto:"Los Juegos Olímpicos modernos fueron restaurados por Pierre de Coubertin en 1896. Inspirados en los juegos de la antigua Olimpia griega, promueven la paz y el entendimiento entre naciones. Chile ha participado desde 1896 y ha obtenido 13 medallas olímpicas en su historia, destacando en tenis y atletismo. Los juegos se realizan cada 4 años alternando verano e invierno.",enunciado:"¿Quién restauró los Juegos Olímpicos modernos?",opciones:["Pierre de Coubertin","Napoleón","Alejandro Magno","Julio César","Churchill"],correcta:0,solucion:"El texto dice 'fueron restaurados por Pierre de Coubertin en 1896'."},

{texto:"El hidrógeno verde se produce mediante electrólisis del agua usando energía renovable. Es considerado un combustible limpio porque su combustión solo emite vapor de agua. Chile tiene potencial para ser líder mundial en producción de hidrógeno verde debido a su radiación solar en el norte y vientos en la Patagonia. La Unión Europea ha invertido en proyectos piloto en Magallanes.",enunciado:"¿Cómo se produce el hidrógeno verde?",opciones:["Electrólisis del agua con energía renovable","Quemando petróleo","Fisión nuclear","Fermentación","Destilación"],correcta:0,solucion:"El texto indica 'se produce mediante electrólisis del agua usando energía renovable'."},

{texto:"El minimalismo es un estilo de vida que promueve reducir posesiones materiales para enfocarse en lo esencial. Popularizado por Marie Kondo y el documental 'Minimalism', propone que menos cosas generan más libertad. Críticos argumentan que es un privilegio de clases acomodadas, ya que los pobres no eligen tener menos. Sin embargo, sus defensores lo ven como una respuesta al consumismo desmedido.",enunciado:"¿Quién popularizó el minimalismo?",opciones:["Marie Kondo","Steve Jobs","Elon Musk","Oprah Winfrey","Gandhi"],correcta:0,solucion:"El texto menciona 'popularizado por Marie Kondo y el documental Minimalism'."},

{texto:"La selva valdiviana es un ecosistema único en el sur de Chile, caracterizado por bosques templados lluviosos con especies como el alerce y el coigüe. Es una de las pocas selvas templadas del mundo, con una biodiversidad comparable a los bosques tropicales. La tala ilegal y los proyectos hidroeléctricos amenazan este patrimonio natural.",enunciado:"¿Qué especies caracterizan la selva valdiviana?",opciones:["Alerce y coigüe","Palmeras y cactus","Pinos y eucaliptus","Robles y encinas","Bambú y orquídeas"],correcta:0,solucion:"El texto menciona 'especies como el alerce y el coigüe'."},

{texto:"El origami japonés es el arte del plegado de papel. Aunque tradicionalmente se hacía con papel cuadrado sin cortes, actualmente existen variantes con miles de pliegues. La NASA ha aplicado principios del origami para diseñar paneles solares desplegables en satélites. Esta conexión entre arte milenario y tecnología espacial demuestra la universalidad del diseño.",enunciado:"¿Cómo ha aplicado la NASA el origami?",opciones:["Diseñando paneles solares desplegables","Haciendo aviones de papel","Decorando oficinas","Entrenando astronautas","Construyendo cohetes"],correcta:0,solucion:"El texto dice 'la NASA ha aplicado principios del origami para diseñar paneles solares desplegables en satélites'."},

{texto:"El vino chileno es reconocido internacionalmente por su calidad. Las condiciones geográficas, con la Cordillera de los Andes al este y el Océano Pacífico al oeste, crean un microclima ideal para la viticultura. Cepas como Carmenere, considerada perdida en Europa, fueron redescubiertas en Chile en 1994. El vino es la principal exportación agroindustrial del país.",enunciado:"¿Qué cepa fue redescubierta en Chile en 1994?",opciones:["Carmenere","Cabernet Sauvignon","Merlot","Chardonnay","Sauvignon Blanc"],correcta:0,solucion:"El texto menciona 'cepas como Carmenere, considerada perdida en Europa, fueron redescubiertas en Chile en 1994'."},

{texto:"El manga japonés es un fenómeno cultural global. A diferencia del cómic occidental, se lee de derecha a izquierda y abarca géneros para todas las edades. 'One Piece', creado por Eiichiro Oda, es el manga más vendido de la historia con más de 500 millones de copias. El anime, su adaptación animada, multiplica su alcance internacional.",enunciado:"¿Cuál es el manga más vendido de la historia?",opciones:["One Piece","Naruto","Dragon Ball","Astro Boy","Sailor Moon"],correcta:0,solucion:"El texto indica 'One Piece, creado por Eiichiro Oda, es el manga más vendido de la historia con más de 500 millones de copias'."},

{texto:"La educación Montessori fue desarrollada por la médica italiana María Montessori en 1907. Se basa en la autonomía del niño, el aprendizaje sensorial y el respeto por los ritmos individuales. Las aulas Montessori tienen materiales didácticos específicos y agrupan niños de diferentes edades. Estudios muestran que sus estudiantes desarrollan mayor creatividad y habilidades sociales.",enunciado:"¿Quién desarrolló la educación Montessori?",opciones:["María Montessori","Marie Curie","Simone de Beauvoir","Gabriela Mistral","Florence Nightingale"],correcta:0,solucion:"El texto dice 'desarrollada por la médica italiana María Montessori en 1907'."},

{texto:"El desierto florido es un fenómeno natural que ocurre en el norte de Chile cuando las lluvias invernales superan el promedio. Semillas que permanecen latentes por años germinan simultáneamente, cubriendo el árido paisaje con flores de colores intensos. Este evento atrae a miles de turistas y ocurre aproximadamente cada 5 a 7 años. El cambio climático amenaza la frecuencia e intensidad de este fenómeno.",enunciado:"¿Qué causa el desierto florido?",opciones:["Lluvias invernales superiores al promedio","Terremotos","Erupciones volcánicas","Vientos fuertes","Heladas"],correcta:0,solucion:"El texto indica 'cuando las lluvias invernales superan el promedio'."},

{texto:"El Louvre es el museo más visitado del mundo, recibiendo más de 10 millones de visitantes al año. Originalmente una fortaleza medieval, se convirtió en palacio real y luego en museo público en 1793. Alberga obras maestras como la Mona Lisa y la Venus de Milo. Su pirámide de cristal, inaugurada en 1989, generó controversia pero hoy es un ícono arquitectónico.",enunciado:"¿En qué año se inauguró la pirámide de cristal?",opciones:["1989","1793","2000","1960","1900"],correcta:0,solucion:"El texto señala 'su pirámide de cristal, inaugurada en 1989'."},
{texto:"La energía geotérmica aprovecha el calor del interior de la Tierra para generar electricidad y calefacción. Islandia obtiene más del 25% de su electricidad de fuentes geotérmicas. Chile, ubicado en el Cinturón de Fuego del Pacífico, tiene un potencial geotérmico estimado en 3,600 MW. Sin embargo, la exploración geotérmica enfrenta altos costos iniciales y oposición de comunidades locales.",enunciado:"¿Qué porcentaje de electricidad obtiene Islandia de geotermia?",opciones:["Más del 25%","5%","50%","75%","100%"],correcta:0,solucion:"El texto dice 'Islandia obtiene más del 25% de su electricidad de fuentes geotérmicas'."},

{texto:"La poesía de Pablo Neruda abarca desde el amor hasta la política. Su obra 'Veinte poemas de amor y una canción desesperada' lo catapultó a la fama a los 20 años. Recibió el Premio Nobel de Literatura en 1971. Su casa en Isla Negra, hoy museo, refleja su fascinación por el mar y los objetos coleccionables. Neruda murió días después del golpe de Estado de 1973.",enunciado:"¿En qué año recibió Neruda el Premio Nobel?",opciones:["1971","1945","1980","1960","1950"],correcta:0,solucion:"El texto indica 'recibió el Premio Nobel de Literatura en 1971'."},

{texto:"El café de especialidad se cultiva en condiciones controladas que maximizan su sabor. A diferencia del café comercial, se califica en una escala de 100 puntos y solo los granos sobre 80 puntos reciben esta denominación. Baristas certificados preparan cada taza con precisión científica, midiendo temperatura, tiempo y molienda. Chile ha visto un auge de cafeterías de especialidad en la última década.",enunciado:"¿A partir de qué puntaje un café es considerado de especialidad?",opciones:["80 puntos","50 puntos","60 puntos","90 puntos","100 puntos"],correcta:0,solucion:"El texto señala 'solo los granos sobre 80 puntos reciben esta denominación'."},

{texto:"El kiwi es una fruta originaria de China, pero su nombre comercial proviene de Nueva Zelanda. Chile es uno de los principales exportadores mundiales de kiwi, especialmente de la variedad Hayward. La fruta es rica en vitamina C y fibra, conteniendo más potasio que un plátano. La cosecha chilena ocurre entre marzo y mayo, abasteciendo al hemisferio norte en contraestación.",enunciado:"¿De dónde es originario el kiwi?",opciones:["China","Nueva Zelanda","Chile","Australia","Japón"],correcta:0,solucion:"El texto dice 'originaria de China, pero su nombre comercial proviene de Nueva Zelanda'."},

{texto:"La robótica blanda (soft robotics) crea robots con materiales flexibles inspirados en organismos vivos como pulpos y gusanos. A diferencia de los robots rígidos tradicionales, pueden adaptarse a entornos complejos y manipular objetos frágiles sin dañarlos. Aplicaciones incluyen cirugía mínimamente invasiva y exploración submarina. La Universidad de Harvard lidera investigaciones en este campo.",enunciado:"¿En qué se inspira la robótica blanda?",opciones:["Organismos como pulpos y gusanos","Motores eléctricos","Computadoras","Aviones","Edificios"],correcta:0,solucion:"El texto dice 'inspirados en organismos vivos como pulpos y gusanos'."},

{texto:"El estrecho de Magallanes, descubierto por Hernando de Magallanes en 1520, conecta los océanos Atlántico y Pacífico. Antes de la apertura del Canal de Panamá en 1914, era la ruta principal entre ambos océanos. Punta Arenas, la ciudad más austral de Chile continental, se desarrolló gracias al tráfico marítimo por el estrecho. Hoy es un destino turístico y base para expediciones antárticas.",enunciado:"¿Quién descubrió el estrecho de Magallanes?",opciones:["Hernando de Magallanes","Cristóbal Colón","Vasco de Gama","Américo Vespucio","Francisco Pizarro"],correcta:0,solucion:"El texto menciona 'descubierto por Hernando de Magallanes en 1520'."},

{texto:"La impresión 3D ha revolucionado la manufactura permitiendo crear objetos capa por capa. En medicina, se imprimen prótesis personalizadas y modelos quirúrgicos. La bioimpresión busca crear tejidos y órganos funcionales con células vivas. En 2023, se imprimió el primer corazón humano en miniatura con tejido cardíaco funcional, aunque el trasplante de órganos impresos aún está lejos.",enunciado:"¿Qué se imprimió en 3D en medicina durante 2023?",opciones:["Un corazón humano en miniatura con tejido funcional","Un riñón completo","Un pulmón trasplantable","Un hígado artificial","Un ojo biónico"],correcta:0,solucion:"El texto dice 'en 2023, se imprimió el primer corazón humano en miniatura con tejido cardíaco funcional'."},

{texto:"El idioma español es el segundo más hablado del mundo por hablantes nativos, con aproximadamente 500 millones de personas. Es oficial en 21 países, la mayoría en Latinoamérica. La Real Academia Española, fundada en 1713, regula el idioma junto con las academias de cada país. El español incorpora constantemente neologismos, especialmente del inglés y de lenguas indígenas.",enunciado:"¿Cuántos hablantes nativos tiene aproximadamente el español?",opciones:["500 millones","200 millones","1,000 millones","100 millones","50 millones"],correcta:0,solucion:"El texto indica 'aproximadamente 500 millones de personas'."},

{texto:"El bosque mediterráneo chileno es una ecorregión única que se extiende desde la Región de Coquimbo hasta La Araucanía. Se caracteriza por arbustos esclerófilos adaptados a veranos secos e inviernos lluviosos. Especies emblemáticas incluyen el quillay, el boldo y el litre. La expansión urbana y los incendios forestales amenazan este ecosistema, declarado hotspot de biodiversidad mundial.",enunciado:"¿Qué tipo de vegetación caracteriza este bosque?",opciones:["Arbustos esclerófilos","Selva tropical","Tundra","Pradera","Desierto"],correcta:0,solucion:"El texto dice 'se caracteriza por arbustos esclerófilos'."},

{texto:"El yoga es una práctica milenaria originada en la India que integra posturas físicas (asanas), respiración (pranayama) y meditación. Existen diversos estilos: Hatha (suave), Vinyasa (dinámico) y Bikram (en calor). Estudios científicos demuestran que reduce el cortisol, mejora la flexibilidad y disminuye la inflamación. La UNESCO lo declaró Patrimonio Cultural Inmaterial en 2016.",enunciado:"¿Qué estilo de yoga se practica en calor?",opciones:["Bikram","Hatha","Vinyasa","Ashtanga","Kundalini"],correcta:0,solucion:"El texto menciona 'Bikram (en calor)'."},

{texto:"La computación cuántica promete resolver problemas imposibles para computadoras clásicas. Usa qubits que pueden estar en múltiples estados simultáneamente (superposición). Google afirmó haber alcanzado la 'supremacía cuántica' en 2019 al realizar un cálculo en 200 segundos que tomaría 10,000 años en una supercomputadora. IBM y otras empresas compiten por construir computadoras cuánticas comerciales.",enunciado:"¿Qué propiedad permite a los qubits estar en múltiples estados?",opciones:["Superposición","Velocidad","Tamaño","Color","Peso"],correcta:0,solucion:"El texto indica 'qubits que pueden estar en múltiples estados simultáneamente (superposición)'."},

{texto:"La contaminación lumínica afecta a la observación astronómica y a los ecosistemas nocturnos. El norte de Chile, especialmente el desierto de Atacama, posee los cielos más limpios del mundo para la astronomía. Observatorios como ALMA y Paranal aprovechan estas condiciones. Regulaciones locales limitan la iluminación artificial para proteger este recurso científico.",enunciado:"¿Por qué el norte de Chile es ideal para astronomía?",opciones:["Cielos más limpios del mundo","Está más cerca del espacio","No tiene nubes nunca","Tiene muchas estrellas","Es el lugar más alto"],correcta:0,solucion:"El texto dice 'el desierto de Atacama, posee los cielos más limpios del mundo para la astronomía'."},

{texto:"El trueque fue la primera forma de comercio antes de la invención del dinero. Consistía en intercambiar bienes directamente: trigo por herramientas, ganado por telas. El dinero surgió para resolver la falta de coincidencia de necesidades. Hoy, plataformas digitales han revivido el trueque moderno, intercambiando servicios como diseño web por clases de idiomas.",enunciado:"¿Por qué surgió el dinero según el texto?",opciones:["Para resolver la falta de coincidencia de necesidades","Porque era bonito","Por decreto real","Para pagar impuestos","Para coleccionarlo"],correcta:0,solucion:"El texto indica 'el dinero surgió para resolver la falta de coincidencia de necesidades'."},

{texto:"Los glaciares chilenos constituyen la mayor reserva de agua dulce de Sudamérica. Campos de Hielo Norte y Sur, en la Patagonia, contienen miles de glaciares. El cambio climático acelera su derretimiento, contribuyendo al aumento del nivel del mar. La Ley de Protección de Glaciares, aprobada en 2022, busca prohibir actividades mineras e industriales en estas zonas.",enunciado:"¿Qué reserva constituyen los glaciares chilenos?",opciones:["La mayor de agua dulce de Sudamérica","La mayor de petróleo","La mayor de carbón","La mayor de hierro","La mayor de litio"],correcta:0,solucion:"El texto dice 'constituyen la mayor reserva de agua dulce de Sudamérica'."},

{texto:"La kombucha es una bebida fermentada de té endulzado que contiene probióticos. Se prepara con un SCOBY (cultivo simbiótico de bacterias y levaduras) que fermenta el té durante 7 a 14 días. Sus defensores le atribuyen beneficios digestivos e inmunológicos, aunque la evidencia científica aún es limitada. El mercado global de kombucha superó los 2,500 millones de dólares en 2023.",enunciado:"¿Qué es un SCOBY?",opciones:["Cultivo simbiótico de bacterias y levaduras","Un tipo de té","Un endulzante","Una vitamina","Un mineral"],correcta:0,solucion:"El texto dice 'SCOBY (cultivo simbiótico de bacterias y levaduras)'."},

{texto:"La civilización inca desarrolló un sistema de caminos que superaba los 30,000 kilómetros. Los chasquis eran mensajeros que corrían distancias cortas relevándose, pudiendo llevar un mensaje a través de cientos de kilómetros en pocos días. Este sistema de postas era más eficiente que muchos correos europeos de la época. El Qhapaq Ñan fue declarado Patrimonio de la Humanidad por la UNESCO.",enunciado:"¿Quiénes eran los chasquis?",opciones:["Mensajeros que corrían relevándose","Soldados de élite","Sacerdotes","Agricultores","Mineros"],correcta:0,solucion:"El texto dice 'los chasquis eran mensajeros que corrían distancias cortas relevándose'."},

{texto:"El fenómeno de El Niño es un calentamiento anómalo de las aguas del Pacífico ecuatorial que altera el clima global. En Chile, provoca lluvias intensas en el norte y sequías en el sur. La Niña es su contraparte fría, con efectos opuestos. Los científicos monitorean estos ciclos mediante boyas oceánicas y satélites para predecir impactos agrícolas y pesqueros.",enunciado:"¿Qué es El Niño?",opciones:["Calentamiento anómalo del Pacífico ecuatorial","Enfriamiento del Atlántico","Un huracán","Una corriente de aire","Un volcán submarino"],correcta:0,solucion:"El texto dice 'calentamiento anómalo de las aguas del Pacífico ecuatorial'."},
{texto:"El fenómeno de El Niño es un calentamiento anómalo de las aguas del Pacífico ecuatorial que altera el clima global. En Chile, provoca lluvias intensas en el norte y sequías en el sur. La Niña es su contraparte fría, con efectos opuestos. Los científicos monitorean estos ciclos mediante boyas oceánicas y satélites para predecir impactos agrícolas y pesqueros.",enunciado:"¿Qué efecto tiene El Niño en el norte de Chile?",opciones:["Lluvias intensas","Sequías","Nieve","Vientos fuertes","Olas de calor"],correcta:0,solucion:"El texto señala 'provoca lluvias intensas en el norte'."},
{texto:"La ceguera de la nieve es una quemadura de la córnea causada por la intensa radiación ultravioleta reflejada en la nieve. Afecta a montañistas y esquiadores sin protección ocular adecuada. Los síntomas aparecen horas después e incluyen dolor intenso y visión borrosa. Los anteojos con filtro UV categoría 4 son esenciales para prevenirla en alta montaña.",enunciado:"¿Qué causa la ceguera de la nieve?",opciones:["Radiación UV reflejada en la nieve","Falta de oxígeno","Bajas temperaturas","Viento fuerte","Comida contaminada"],correcta:0,solucion:"El texto indica 'radiación ultravioleta reflejada en la nieve'."},

{texto:"La quinoa es un pseudocereal cultivado en los Andes desde hace más de 5,000 años. Contiene todos los aminoácidos esenciales, siendo una proteína completa poco común en el reino vegetal. Bolivia y Perú lideran la producción mundial. La NASA la incluyó en la dieta de astronautas por su alto valor nutricional. Su popularidad global ha aumentado su precio, afectando a consumidores tradicionales andinos.",enunciado:"¿Qué hace especial la proteína de la quinoa?",opciones:["Contiene todos los aminoácidos esenciales","Es de origen animal","No tiene proteínas","Es baja en fibra","Es artificial"],correcta:0,solucion:"El texto dice 'contiene todos los aminoácidos esenciales, siendo una proteína completa'."},
{texto:"La quinoa es un pseudocereal cultivado en los Andes desde hace más de 5,000 años. Contiene todos los aminoácidos esenciales, siendo una proteína completa poco común en el reino vegetal. Bolivia y Perú lideran la producción mundial. La NASA la incluyó en la dieta de astronautas por su alto valor nutricional. Su popularidad global ha aumentado su precio, afectando a consumidores tradicionales andinos.",enunciado:"¿Qué efecto negativo tuvo su popularidad global?",opciones:["Aumentó su precio afectando a consumidores andinos","Mejoró la economía andina","Desapareció el cultivo","Se volvió tóxica","Perdió nutrientes"],correcta:0,solucion:"El texto señala 'su popularidad global ha aumentado su precio, afectando a consumidores tradicionales andinos'."},
{texto:"El Canal de Panamá, inaugurado en 1914, conecta el Atlántico con el Pacífico evitando rodear Sudamérica. Utiliza un sistema de esclusas que eleva los barcos 26 metros sobre el nivel del mar. En 2016 se completó una ampliación que permite el paso de buques de mayor calado. Panamá obtiene importantes ingresos por peajes, pero la sequía amenaza el suministro de agua para las esclusas.",enunciado:"¿Cuánto elevan las esclusas a los barcos?",opciones:["26 metros","10 metros","50 metros","100 metros","5 metros"],correcta:0,solucion:"El texto menciona 'eleva los barcos 26 metros sobre el nivel del mar'."},
{texto:"El Canal de Panamá, inaugurado en 1914, conecta el Atlántico con el Pacífico evitando rodear Sudamérica. Utiliza un sistema de esclusas que eleva los barcos 26 metros sobre el nivel del mar. En 2016 se completó una ampliación que permite el paso de buques de mayor calado. Panamá obtiene importantes ingresos por peajes, pero la sequía amenaza el suministro de agua para las esclusas.",enunciado:"¿Qué amenaza el funcionamiento del canal?",opciones:["La sequía","El exceso de barcos","Los piratas","Los terremotos","El deshielo"],correcta:0,solucion:"El texto dice 'la sequía amenaza el suministro de agua para las esclusas'."},
{texto:"La realidad virtual (RV) sumerge al usuario en un entorno digital mediante visores especiales. La realidad aumentada (RA) superpone elementos digitales al mundo real, como en Pokémon Go. Empresas como Meta y Apple invierten miles de millones en el 'metaverso', un espacio virtual compartido. Críticos advierten sobre adicción, privacidad y desconexión de la realidad física.",enunciado:"¿Qué diferencia hay entre RV y RA?",opciones:["RV sumerge en entorno digital; RA superpone elementos al mundo real","Son lo mismo","RV usa solo audio","RA no existe","RV solo para juegos"],correcta:0,solucion:"El texto explica 'RV sumerge en entorno digital; RA superpone elementos digitales al mundo real'."},

{texto:"Los humedales son ecosistemas que permanecen inundados de forma permanente o estacional. Actúan como esponjas naturales que regulan inundaciones y filtran contaminantes del agua. El Convenio Ramsar protege más de 2,400 humedales de importancia internacional. En Chile, el humedal de El Yali y los humedales de Tongoy están protegidos, aunque la expansión agrícola los amenaza.",enunciado:"¿Qué función cumplen los humedales?",opciones:["Regular inundaciones y filtrar contaminantes","Producir electricidad","Generar calor","Almacenar petróleo","Fabricar oxígeno exclusivamente"],correcta:0,solucion:"El texto dice 'actúan como esponjas naturales que regulan inundaciones y filtran contaminantes del agua'."},
{texto:"Los humedales son ecosistemas que permanecen inundados de forma permanente o estacional. Actúan como esponjas naturales que regulan inundaciones y filtran contaminantes del agua. El Convenio Ramsar protege más de 2,400 humedales de importancia internacional. En Chile, el humedal de El Yali y los humedales de Tongoy están protegidos, aunque la expansión agrícola los amenaza.",enunciado:"¿Qué convenio internacional protege los humedales?",opciones:["Convenio Ramsar","Protocolo de Kioto","Acuerdo de París","Tratado de Versalles","Convenio de Ginebra"],correcta:0,solucion:"El texto menciona 'el Convenio Ramsar protege más de 2,400 humedales'."},
{texto:"El colibrí de Juan Fernández es una especie endémica de la isla Robinson Crusoe, en el archipiélago chileno del Pacífico. Es el colibrí más austral del mundo y está en peligro crítico de extinción con menos de 400 ejemplares. La introducción de especies exóticas como gatos y conejos ha destruido su hábitat. Programas de conservación buscan proteger los nidos y controlar depredadores.",enunciado:"¿Cuántos ejemplares quedan aproximadamente?",opciones:["Menos de 400","10,000","5,000","1,000","50,000"],correcta:0,solucion:"El texto indica 'en peligro crítico de extinción con menos de 400 ejemplares'."},
{texto:"El colibrí de Juan Fernández es una especie endémica de la isla Robinson Crusoe, en el archipiélago chileno del Pacífico. Es el colibrí más austral del mundo y está en peligro crítico de extinción con menos de 400 ejemplares. La introducción de especies exóticas como gatos y conejos ha destruido su hábitat. Programas de conservación buscan proteger los nidos y controlar depredadores.",enunciado:"¿Qué causó la destrucción de su hábitat?",opciones:["Introducción de gatos y conejos","Turismo excesivo","Incendios","Minería","Agricultura"],correcta:0,solucion:"El texto señala 'la introducción de especies exóticas como gatos y conejos ha destruido su hábitat'."},
{texto:"La filosofía del 'hygge' danés promueve el bienestar a través de la calidez, la comodidad y la conexión humana. Velas, mantas suaves y cenas con amigos definen este concepto intraducible. Dinamarca figura consistentemente entre los países más felices del mundo. El hygge ha inspirado tendencias globales de decoración y estilo de vida, aunque críticos señalan que es difícil replicarlo fuera del contexto nórdico.",enunciado:"¿Qué elementos definen el hygge?",opciones:["Velas, mantas suaves y cenas con amigos","Tecnología avanzada","Riqueza material","Deportes extremos","Soledad"],correcta:0,solucion:"El texto dice 'velas, mantas suaves y cenas con amigos definen este concepto'."},
{texto:"La filosofía del 'hygge' danés promueve el bienestar a través de la calidez, la comodidad y la conexión humana. Velas, mantas suaves y cenas con amigos definen este concepto intraducible. Dinamarca figura consistentemente entre los países más felices del mundo. El hygge ha inspirado tendencias globales de decoración y estilo de vida, aunque críticos señalan que es difícil replicarlo fuera del contexto nórdico.",enunciado:"¿Qué crítica recibe la exportación del hygge?",opciones:["Es difícil replicarlo fuera del contexto nórdico","Es demasiado caro","No existe","Solo funciona en verano","Es anticuado"],correcta:0,solucion:"El texto menciona 'críticos señalan que es difícil replicarlo fuera del contexto nórdico'."},
{texto:"Los rayos cósmicos son partículas de alta energía que bombardean constantemente la Tierra desde el espacio exterior. Provienen de supernovas y agujeros negros distantes. La atmósfera nos protege de la mayoría, pero representan un riesgo para astronautas en misiones a Marte. Detectores en el observatorio Pierre Auger, en Argentina, estudian su origen y composición.",enunciado:"¿De dónde provienen los rayos cósmicos?",opciones:["Supernovas y agujeros negros distantes","El Sol exclusivamente","La Luna","La Tierra","Las nubes"],correcta:0,solucion:"El texto dice 'provienen de supernovas y agujeros negros distantes'."},
{texto:"Los rayos cósmicos son partículas de alta energía que bombardean constantemente la Tierra desde el espacio exterior. Provienen de supernovas y agujeros negros distantes. La atmósfera nos protege de la mayoría, pero representan un riesgo para astronautas en misiones a Marte. Detectores en el observatorio Pierre Auger, en Argentina, estudian su origen y composición.",enunciado:"¿Dónde se encuentra el observatorio Pierre Auger?",opciones:["Argentina","Chile","Brasil","México","España"],correcta:0,solucion:"El texto menciona 'el observatorio Pierre Auger, en Argentina'."},
{texto:"La técnica pomodoro es un método de gestión del tiempo que alterna 25 minutos de trabajo concentrado con 5 minutos de descanso. Desarrollada por Francesco Cirillo en los años 80, debe su nombre al temporizador de cocina con forma de tomate que usaba. Cada 4 ciclos se toma un descanso más largo de 15-30 minutos. Estudios avalan que mejora la productividad y reduce la fatiga mental.",enunciado:"¿Cuánto dura un ciclo pomodoro de trabajo?",opciones:["25 minutos","5 minutos","1 hora","50 minutos","10 minutos"],correcta:0,solucion:"El texto dice '25 minutos de trabajo concentrado con 5 minutos de descanso'."},
{texto:"La técnica pomodoro es un método de gestión del tiempo que alterna 25 minutos de trabajo concentrado con 5 minutos de descanso. Desarrollada por Francesco Cirillo en los años 80, debe su nombre al temporizador de cocina con forma de tomate que usaba. Cada 4 ciclos se toma un descanso más largo de 15-30 minutos. Estudios avalan que mejora la productividad y reduce la fatiga mental.",enunciado:"¿De dónde viene el nombre 'pomodoro'?",opciones:["Del temporizador con forma de tomate que usaba Cirillo","De una ciudad italiana","De un tipo de pasta","De un científico","De una marca comercial"],correcta:0,solucion:"El texto explica 'debe su nombre al temporizador de cocina con forma de tomate que usaba'."},
{texto:"La agricultura vertical cultiva plantas en capas apiladas en ambientes controlados, usualmente en almacenes urbanos. Usa iluminación LED, hidroponía y control climático preciso. Consume 95% menos agua que la agricultura tradicional y no requiere pesticidas. Empresas en Japón y Estados Unidos producen lechugas y hierbas cerca de los consumidores, reduciendo transporte.",enunciado:"¿Cuánta agua ahorra respecto a la agricultura tradicional?",opciones:["95%","50%","25%","10%","0%"],correcta:0,solucion:"El texto indica 'consume 95% menos agua que la agricultura tradicional'."},
{texto:"La agricultura vertical cultiva plantas en capas apiladas en ambientes controlados, usualmente en almacenes urbanos. Usa iluminación LED, hidroponía y control climático preciso. Consume 95% menos agua que la agricultura tradicional y no requiere pesticidas. Empresas en Japón y Estados Unidos producen lechugas y hierbas cerca de los consumidores, reduciendo transporte.",enunciado:"¿Qué ventaja adicional tiene sobre la agricultura tradicional?",opciones:["No requiere pesticidas","Es más cara","Usa más agua","Necesita más terreno","Es más lenta"],correcta:0,solucion:"El texto señala 'no requiere pesticidas'."},
{texto:"La lengua de señas chilena (LSCh) es utilizada por la comunidad sorda del país. Aunque comparte raíces con otras lenguas de señas, tiene gramática y vocabulario propios. La Ley 21.303 de 2021 reconoce la LSCh como lengua oficial y exige intérpretes en servicios públicos. Escuelas especiales y asociaciones promueven su enseñanza para inclusión.",enunciado:"¿En qué año se reconoció oficialmente la LSCh?",opciones:["2021","2010","2015","2000","2023"],correcta:0,solucion:"El texto menciona 'la Ley 21.303 de 2021 reconoce la LSCh como lengua oficial'."},
{texto:"La lengua de señas chilena (LSCh) es utilizada por la comunidad sorda del país. Aunque comparte raíces con otras lenguas de señas, tiene gramática y vocabulario propios. La Ley 21.303 de 2021 reconoce la LSCh como lengua oficial y exige intérpretes en servicios públicos. Escuelas especiales y asociaciones promueven su enseñanza para inclusión.",enunciado:"¿Qué exige la ley respecto a servicios públicos?",opciones:["Intérpretes en servicios públicos","Cerrar escuelas especiales","Eliminar la LSCh","Solo enseñanza oral","Traducción escrita"],correcta:0,solucion:"El texto dice 'exige intérpretes en servicios públicos'."},
{texto:"El pez payaso, popularizado por la película 'Buscando a Nemo', vive en simbiosis con anémonas marinas. Sus cuerpos están recubiertos de un moco especial que los protege de las picaduras venenosas de la anémona. A cambio de protección, el pez payaso limpia la anémona y la oxigena con su movimiento. Son hermafroditas secuenciales: todos nacen machos y el dominante se convierte en hembra.",enunciado:"¿Cómo se protege el pez payaso de la anémona?",opciones:["Con un moco especial que lo protege de picaduras","Escapando rápidamente","Mordiendo a la anémona","Cambiando de color","Escondiéndose"],correcta:0,solucion:"El texto indica 'cubiertos de un moco especial que los protege de las picaduras'."},
{texto:"El pez payaso, popularizado por la película 'Buscando a Nemo', vive en simbiosis con anémonas marinas. Sus cuerpos están recubiertos de un moco especial que los protege de las picaduras venenosas de la anémona. A cambio de protección, el pez payaso limpia la anémona y la oxigena con su movimiento. Son hermafroditas secuenciales: todos nacen machos y el dominante se convierte en hembra.",enunciado:"¿Qué peculiaridad reproductiva tiene el pez payaso?",opciones:["Hermafroditismo secuencial: todos nacen machos","Ponen huevos en tierra","Son vivíparos","No se reproducen","Son solo hembras"],correcta:0,solucion:"El texto dice 'son hermafroditas secuenciales: todos nacen machos y el dominante se convierte en hembra'."},
{texto:"La permacultura es un sistema de diseño agrícola que imita los patrones de la naturaleza. Creado por Bill Mollison en los años 70, integra agua, plantas, animales y construcciones en ciclos sostenibles. A diferencia de la agricultura industrial, busca regenerar el suelo y aumentar la biodiversidad. Huertos comunitarios en Chile aplican principios de permacultura con éxito.",enunciado:"¿Quién creó el concepto de permacultura?",opciones:["Bill Mollison","Charles Darwin","Gregor Mendel","Norman Borlaug","John Deere"],correcta:0,solucion:"El texto menciona 'creado por Bill Mollison en los años 70'."},
{texto:"La permacultura es un sistema de diseño agrícola que imita los patrones de la naturaleza. Creado por Bill Mollison en los años 70, integra agua, plantas, animales y construcciones en ciclos sostenibles. A diferencia de la agricultura industrial, busca regenerar el suelo y aumentar la biodiversidad. Huertos comunitarios en Chile aplican principios de permacultura con éxito.",enunciado:"¿Qué busca la permacultura a diferencia de la agricultura industrial?",opciones:["Regenerar el suelo y aumentar biodiversidad","Maximizar ganancias","Usar más pesticidas","Monocultivo extensivo","Mecanización total"],correcta:0,solucion:"El texto señala 'busca regenerar el suelo y aumentar la biodiversidad'."},
{texto:"La filosofía budista zen enfatiza la meditación sentada (zazen) y la atención plena en las actividades cotidianas. Originada en China como Chan, floreció en Japón donde influyó en las artes marciales, la ceremonia del té y la jardinería. El zen busca la iluminación a través de la experiencia directa, no de los textos sagrados. Sus técnicas de meditación han sido adoptadas por la psicología occidental.",enunciado:"¿Cómo se llama la meditación sentada zen?",opciones:["Zazen","Yoga","Tai chi","Mantra","Vipassana"],correcta:0,solucion:"El texto dice 'la meditación sentada (zazen)'."},
{texto:"La filosofía budista zen enfatiza la meditación sentada (zazen) y la atención plena en las actividades cotidianas. Originada en China como Chan, floreció en Japón donde influyó en las artes marciales, la ceremonia del té y la jardinería. El zen busca la iluminación a través de la experiencia directa, no de los textos sagrados. Sus técnicas de meditación han sido adoptadas por la psicología occidental.",enunciado:"¿Cómo busca el zen la iluminación?",opciones:["A través de la experiencia directa, no de textos","Leyendo libros sagrados","Rezando","Ayunando","Peregrinando"],correcta:0,solucion:"El texto menciona 'busca la iluminación a través de la experiencia directa, no de los textos sagrados'."},
{texto:"El ozono troposférico es un contaminante que se forma cuando los óxidos de nitrógeno y compuestos orgánicos reaccionan con la luz solar. A diferencia del ozono estratosférico que nos protege de rayos UV, el troposférico daña los pulmones y las plantas. Santiago de Chile sufre episodios críticos de ozono en verano debido al tráfico vehicular y la radiación solar intensa.",enunciado:"¿Qué diferencia hay entre ozono estratosférico y troposférico?",opciones:["El estratosférico protege de UV; el troposférico daña pulmones","Son iguales","El troposférico es beneficioso","El estratosférico contamina","No existe diferencia"],correcta:0,solucion:"El texto explica 'el estratosférico que nos protege de rayos UV, el troposférico daña los pulmones'."},
{texto:"El ozono troposférico es un contaminante que se forma cuando los óxidos de nitrógeno y compuestos orgánicos reaccionan con la luz solar. A diferencia del ozono estratosférico que nos protege de rayos UV, el troposférico daña los pulmones y las plantas. Santiago de Chile sufre episodios críticos de ozono en verano debido al tráfico vehicular y la radiación solar intensa.",enunciado:"¿Qué causa los episodios críticos de ozono en Santiago?",opciones:["Tráfico vehicular y radiación solar intensa","Lluvias","Viento sur","Bajas temperaturas","Nieve"],correcta:0,solucion:"El texto dice 'debido al tráfico vehicular y la radiación solar intensa'."},
{texto:"La anatomía de un huracán incluye el ojo central (zona de calma), la pared del ojo (vientos más intensos) y las bandas de lluvia en espiral. Se forman sobre océanos cálidos con temperaturas superiores a 26°C. Chile rara vez recibe huracanes debido a la corriente fría de Humboldt. La escala Saffir-Simpson clasifica los huracanes del 1 al 5 según la velocidad del viento.",enunciado:"¿Qué temperatura oceánica se necesita para formar huracanes?",opciones:["Superior a 26°C","Bajo 0°C","Entre 10-15°C","20°C exactamente","Cualquier temperatura"],correcta:0,solucion:"El texto indica 'sobre océanos cálidos con temperaturas superiores a 26°C'."},
{texto:"La anatomía de un huracán incluye el ojo central (zona de calma), la pared del ojo (vientos más intensos) y las bandas de lluvia en espiral. Se forman sobre océanos cálidos con temperaturas superiores a 26°C. Chile rara vez recibe huracanes debido a la corriente fría de Humboldt. La escala Saffir-Simpson clasifica los huracanes del 1 al 5 según la velocidad del viento.",enunciado:"¿Por qué Chile rara vez recibe huracanes?",opciones:["Por la corriente fría de Humboldt","Por su ubicación al sur","Por los Andes","Por su tamaño","Por su población"],correcta:0,solucion:"El texto menciona 'debido a la corriente fría de Humboldt'."},
{texto:"El estoicismo moderno ha resurgido como filosofía práctica para afrontar la incertidumbre. Libros como 'El obstáculo es el camino' de Ryan Holiday aplican principios estoicos a los negocios y la vida personal. La dicotomía del control (preocuparse solo por lo que podemos controlar) es su enseñanza central. Terapias como la cognitivo-conductual incorporan esta sabiduría milenaria.",enunciado:"¿Cuál es la enseñanza central del estoicismo?",opciones:["La dicotomía del control","El placer como meta","La acumulación de riqueza","La fama","La venganza"],correcta:0,solucion:"El texto dice 'la dicotomía del control (preocuparse solo por lo que podemos controlar) es su enseñanza central'."},
{texto:"El estoicismo moderno ha resurgido como filosofía práctica para afrontar la incertidumbre. Libros como 'El obstáculo es el camino' de Ryan Holiday aplican principios estoicos a los negocios y la vida personal. La dicotomía del control (preocuparse solo por lo que podemos controlar) es su enseñanza central. Terapias como la cognitivo-conductual incorporan esta sabiduría milenaria.",enunciado:"¿Qué terapia moderna incorpora principios estoicos?",opciones:["Terapia cognitivo-conductual","Psicoanálisis","Hipnosis","Musicoterapia","Arteterapia"],correcta:0,solucion:"El texto señala 'terapias como la cognitivo-conductual incorporan esta sabiduría milenaria'."},
{texto:"El pingüino de Humboldt anida en las costas de Chile y Perú. A diferencia de los pingüinos antárticos, se adapta a climas templados. La corriente de Humboldt, rica en nutrientes, provee abundante alimento. Está clasificado como vulnerable debido a la pesca excesiva, la contaminación y el cambio climático. Islas como Chiloé y Punihuil albergan colonias reproductivas importantes.",enunciado:"¿Dónde anida el pingüino de Humboldt?",opciones:["Costas de Chile y Perú","Antártica","Ártico","Australia","Sudáfrica"],correcta:0,solucion:"El texto menciona 'anida en las costas de Chile y Perú'."},
{texto:"El pingüino de Humboldt anida en las costas de Chile y Perú. A diferencia de los pingüinos antárticos, se adapta a climas templados. La corriente de Humboldt, rica en nutrientes, provee abundante alimento. Está clasificado como vulnerable debido a la pesca excesiva, la contaminación y el cambio climático. Islas como Chiloé y Punihuil albergan colonias reproductivas importantes.",enunciado:"¿Cuál es su estado de conservación?",opciones:["Vulnerable","Extinto","Preocupación menor","Abundante","Domesticado"],correcta:0,solucion:"El texto dice 'está clasificado como vulnerable'."},

{texto:"La caligrafía japonesa (shodo) es un arte que combina escritura y pintura con siglos de tradición. Se practica con pincel, tinta y papel de arroz. Más que la legibilidad, valora la expresividad del trazo y la armonía de la composición. El shodo está vinculado al budismo zen y a la meditación. En Japón, los niños aprenden caligrafía desde la escuela primaria.",enunciado:"¿Cómo se llama el arte de la caligrafía japonesa?",opciones:["Shodo","Origami","Ikebana","Bonsái","Manga"],correcta:0,solucion:"El texto dice 'la caligrafía japonesa (shodo)'."},

{texto:"La criopreservación consiste en congelar células, tejidos o cuerpos a temperaturas extremadamente bajas (-196°C) con la esperanza de reanimarlos en el futuro. Empresas ofrecen este servicio para mascotas y humanos. Aunque óvulos y embriones se criopreservan con éxito, la criogenización de cuerpos completos sigue siendo especulativa sin evidencia de que la reanimación sea posible.",enunciado:"¿A qué temperatura se realiza la criopreservación?",opciones:["-196°C","0°C","-10°C","100°C","37°C"],correcta:0,solucion:"El texto indica 'temperaturas extremadamente bajas (-196°C)'."},

{texto:"El café cold brew se prepara sumergiendo café molido en agua fría durante 12 a 24 horas. Este método produce una bebida menos ácida y más suave que el café caliente tradicional. Se ha popularizado globalmente, con un mercado que crece un 25% anual. Contiene más cafeína que el café filtrado debido a la mayor proporción de café por agua.",enunciado:"¿Cuánto tiempo se sumerge el café en agua fría?",opciones:["12 a 24 horas","5 minutos","1 hora","30 minutos","1 semana"],correcta:0,solucion:"El texto menciona 'sumergiendo café molido en agua fría durante 12 a 24 horas'."},

{texto:"El pueblo rapanui habita la Isla de Pascua desde hace más de 1,000 años. Sus antepasados construyeron los moáis, estatuas monumentales de piedra volcánica. La deforestación y el agotamiento de recursos casi colapsaron su civilización. Hoy, el turismo masivo amenaza el frágil ecosistema de la isla, mientras la comunidad rapanui lucha por preservar su cultura y autonomía.",enunciado:"¿Qué son los moáis?",opciones:["Estatuas monumentales de piedra volcánica","Barcos de guerra","Instrumentos musicales","Armas antiguas","Viviendas"],correcta:0,solucion:"El texto dice 'construyeron los moáis, estatuas monumentales de piedra volcánica'."},

{texto:"Los perros guía son entrenados desde cachorros para asistir a personas ciegas. Aprenden a obedecer comandos, pero también a desobedecer inteligentemente cuando una orden pone en peligro a su dueño. La raza más común es el Labrador Retriever por su inteligencia y temperamento. La ley chilena garantiza el acceso de perros guía a todos los espacios públicos.",enunciado:"¿Qué es la desobediencia inteligente?",opciones:["Desobedecer cuando una orden pone en peligro al dueño","Ignorar siempre","Hacer solo lo que quieren","No aprender comandos","Ser agresivos"],correcta:0,solucion:"El texto indica 'aprenden a desobedecer inteligentemente cuando una orden pone en peligro a su dueño'."},

{texto:"La basura electrónica (e-waste) es el flujo de desechos de más rápido crecimiento mundial. Celulares, computadores y electrodomésticos contienen metales valiosos como oro y cobre, pero también tóxicos como plomo y mercurio. Solo el 17% se recicla adecuadamente. Chile genera 9.5 kg de e-waste por persona al año, liderando Latinoamérica.",enunciado:"¿Qué porcentaje de basura electrónica se recicla adecuadamente?",opciones:["17%","50%","0%","75%","100%"],correcta:0,solucion:"El texto dice 'solo el 17% se recicla adecuadamente'."},

{texto:"El fenómeno de la 'puerta giratoria' describe el tránsito de personas entre altos cargos públicos y privados en el mismo sector. Críticos argumentan que genera conflictos de interés: un regulador puede favorecer a una empresa esperando un futuro empleo. Varios países imponen períodos de 'enfriamiento' antes de aceptar cargos en industrias previamente reguladas.",enunciado:"¿Qué es la 'puerta giratoria'?",opciones:["Tránsito entre cargos públicos y privados en el mismo sector","Una puerta mecánica","Un tipo de corrupción exclusivamente","Un programa de televisión","Un edificio inteligente"],correcta:0,solucion:"El texto explica 'el tránsito de personas entre altos cargos públicos y privados en el mismo sector'."},

{texto:"El bambú es uno de los materiales más sostenibles del planeta. Crece hasta 1 metro por día y absorbe 4 veces más CO₂ que los árboles equivalentes. Se usa en construcción, textiles y hasta bicicletas. En Chile se está explorando su cultivo en zonas templadas. Su resistencia a la tracción supera al acero, convirtiéndolo en el 'acero vegetal'.",enunciado:"¿Cuánto CO₂ absorbe comparado con árboles equivalentes?",opciones:["4 veces más","Igual","La mitad","10 veces más","No absorbe CO₂"],correcta:0,solucion:"El texto indica 'absorbe 4 veces más CO₂ que los árboles equivalentes'."},

{texto:"La diplomacia del ping-pong entre Estados Unidos y China en 1971 allanó el camino para la visita de Nixon a Beijing y el restablecimiento de relaciones. Un equipo estadounidense de tenis de mesa fue invitado a China, rompiendo décadas de aislamiento. Este caso muestra cómo el deporte puede ser una herramienta de soft power y distensión política.",enunciado:"¿En qué año ocurrió la diplomacia del ping-pong?",opciones:["1971","1960","1980","1990","2000"],correcta:0,solucion:"El texto menciona 'la diplomacia del ping-pong entre Estados Unidos y China en 1971'."},

{texto:"La técnica Feynman para aprender consiste en explicar un concepto en términos simples, como si se lo enseñaras a un niño. Si no puedes simplificarlo, es que no lo entiendes completamente. Richard Feynman, físico ganador del Nobel, usaba este método para dominar temas complejos. Estudiantes de todo el mundo la aplican para estudiar matemáticas, ciencias y humanidades.",enunciado:"¿En qué consiste la técnica Feynman?",opciones:["Explicar un concepto en términos simples","Memorizar todo","Leer 10 veces","Subrayar libros","Hacer resúmenes largos"],correcta:0,solucion:"El texto dice 'explicar un concepto en términos simples, como si se lo enseñaras a un niño'."},
{texto:"La técnica Feynman para aprender consiste en explicar un concepto en términos simples, como si se lo enseñaras a un niño. Si no puedes simplificarlo, es que no lo entiendes completamente. Richard Feynman, físico ganador del Nobel, usaba este método para dominar temas complejos. Estudiantes de todo el mundo la aplican para estudiar matemáticas, ciencias y humanidades.",enunciado:"¿Quién creó esta técnica?",opciones:["Richard Feynman","Albert Einstein","Isaac Newton","Stephen Hawking","Marie Curie"],correcta:0,solucion:"El texto menciona 'Richard Feynman, físico ganador del Nobel, usaba este método'."},
{texto:"El Salar de Atacama es el mayor depósito de litio de Chile y uno de los más grandes del mundo. La extracción de litio por evaporación consume enormes cantidades de agua en una de las zonas más áridas del planeta. Esto genera conflictos con comunidades atacameñas y afecta a flamencos y otros animales. Se investigan métodos de extracción directa que reduzcan el impacto hídrico.",enunciado:"¿Qué problema genera la extracción de litio en el Salar?",opciones:["Consume enormes cantidades de agua","Produce mucho ruido","Contamina el aire","Genera tráfico","Aumenta el turismo"],correcta:0,solucion:"El texto indica 'la extracción de litio por evaporación consume enormes cantidades de agua'."},

{texto:"La técnica del 'bullet journal' es un método de organización personal que combina agenda, diario y lista de tareas. Creado por Ryder Carroll, usa un sistema de símbolos simples para categorizar eventos, tareas y notas. Su flexibilidad lo ha convertido en un fenómeno global. A diferencia de las apps digitales, escribir a mano mejora la retención y reduce la ansiedad.",enunciado:"¿Quién creó el bullet journal?",opciones:["Ryder Carroll","Steve Jobs","Bill Gates","Mark Zuckerberg","Jeff Bezos"],correcta:0,solucion:"El texto dice 'creado por Ryder Carroll'."},

{texto:"Los huertos urbanos están transformando las ciudades. En terrenos baldíos, techos y balcones se cultivan verduras y hortalizas. Además de proveer alimentos frescos, mejoran la calidad del aire, reducen islas de calor y fortalecen comunidades. La Municipalidad de Santiago apoya huertos comunitarios que abastecen ollas comunes. Es un movimiento global de soberanía alimentaria.",enunciado:"¿Qué beneficio social tienen los huertos urbanos?",opciones:["Fortalecen comunidades y soberanía alimentaria","Aumentan el ruido","Contaminan el suelo","Alejan a los vecinos","Son solo decorativos"],correcta:0,solucion:"El texto menciona 'fortalecen comunidades' y 'es un movimiento global de soberanía alimentaria'."},

{texto:"El ayuno intermitente alterna períodos de alimentación con períodos de ayuno. El método 16/8 (16 horas de ayuno, 8 de alimentación) es el más popular. Estudios sugieren beneficios como pérdida de peso, mejora de la sensibilidad a la insulina y autofagia celular. Nutricionistas recomiendan supervisión profesional, especialmente para personas con condiciones médicas preexistentes.",enunciado:"¿En qué consiste el método 16/8?",opciones:["16 horas de ayuno, 8 de alimentación","16 comidas al día","8 horas de ayuno","16 días de ayuno","Comer cada 16 minutos"],correcta:0,solucion:"El texto indica 'el método 16/8 (16 horas de ayuno, 8 de alimentación)'."},

{texto:"La lengua mapuche o mapudungun significa 'habla de la tierra'. Pertenece a una familia lingüística aislada, sin parentesco demostrado con otras lenguas. Tiene sonidos inexistentes en español, como la 'ü' y la 'ng' inicial. Programas de revitalización buscan aumentar el número de hablantes, especialmente entre los jóvenes. La poesía mapuche contemporánea es una de sus expresiones más vibrantes.",enunciado:"¿Qué significa mapudungun?",opciones:["Habla de la tierra","Lengua del cielo","Idioma del sur","Palabra antigua","Voz del pueblo"],correcta:0,solucion:"El texto dice 'la lengua mapuche o mapudungun significa habla de la tierra'."},

{texto:"La fotosíntesis es el proceso mediante el cual las plantas convierten luz solar en energía química. Ocurre en los cloroplastos, donde la clorofila captura fotones. Como subproducto, liberan oxígeno a la atmósfera, haciendo posible la vida animal. Sin fotosíntesis, la Tierra sería un planeta estéril. Los bosques tropicales producen el 28% del oxígeno mundial.",enunciado:"¿Dónde ocurre la fotosíntesis?",opciones:["En los cloroplastos","En las mitocondrias","En el núcleo","En la membrana","En el citoplasma"],correcta:0,solucion:"El texto indica 'ocurre en los cloroplastos, donde la clorofila captura fotones'."},
{texto:"La fotosíntesis es el proceso mediante el cual las plantas convierten luz solar en energía química. Ocurre en los cloroplastos, donde la clorofila captura fotones. Como subproducto, liberan oxígeno a la atmósfera, haciendo posible la vida animal. Sin fotosíntesis, la Tierra sería un planeta estéril. Los bosques tropicales producen el 28% del oxígeno mundial.",enunciado:"¿Qué porcentaje del oxígeno mundial producen los bosques tropicales?",opciones:["28%","50%","10%","75%","90%"],correcta:0,solucion:"El texto menciona 'los bosques tropicales producen el 28% del oxígeno mundial'."},
{texto:"La civilización sumeria inventó la escritura cuneiforme alrededor del 3200 a.C. en Mesopotamia. Escribían sobre tablillas de arcilla con un punzón de caña. Los primeros textos no eran literarios, sino registros contables de granos y ganado. La escritura nació de la necesidad administrativa, no del arte. Este invento marca el fin de la Prehistoria y el inicio de la Historia.",enunciado:"¿Para qué se usaron los primeros textos cuneiformes?",opciones:["Registros contables de granos y ganado","Poemas épicos","Textos religiosos","Cartas de amor","Leyes"],correcta:0,solucion:"El texto dice 'los primeros textos no eran literarios, sino registros contables de granos y ganado'."},
{texto:"La civilización sumeria inventó la escritura cuneiforme alrededor del 3200 a.C. en Mesopotamia. Escribían sobre tablillas de arcilla con un punzón de caña. Los primeros textos no eran literarios, sino registros contables de granos y ganado. La escritura nació de la necesidad administrativa, no del arte. Este invento marca el fin de la Prehistoria y el inicio de la Historia.",enunciado:"¿Qué evento marca el inicio de la Historia?",opciones:["La invención de la escritura","La construcción de pirámides","El descubrimiento del fuego","La rueda","La agricultura"],correcta:0,solucion:"El texto indica 'este invento marca el fin de la Prehistoria y el inicio de la Historia'."},
{texto:"El minimalismo digital propone usar la tecnología con intención, eliminando aplicaciones y hábitos que no aportan valor. Cal Newport, autor de 'Minimalismo digital', recomienda períodos de 30 días de 'desintoxicación' tecnológica. No se trata de rechazar la tecnología, sino de recuperar el control sobre ella. Quienes lo practican reportan mayor concentración y satisfacción personal.",enunciado:"¿Quién escribió 'Minimalismo digital'?",opciones:["Cal Newport","Marie Kondo","Tim Ferriss","Simon Sinek","Malcolm Gladwell"],correcta:0,solucion:"El texto menciona 'Cal Newport, autor de Minimalismo digital'."},
{texto:"El minimalismo digital propone usar la tecnología con intención, eliminando aplicaciones y hábitos que no aportan valor. Cal Newport, autor de 'Minimalismo digital', recomienda períodos de 30 días de 'desintoxicación' tecnológica. No se trata de rechazar la tecnología, sino de recuperar el control sobre ella. Quienes lo practican reportan mayor concentración y satisfacción personal.",enunciado:"¿Cuánto dura la desintoxicación tecnológica recomendada?",opciones:["30 días","1 día","1 semana","1 año","Para siempre"],correcta:0,solucion:"El texto dice 'recomienda períodos de 30 días de desintoxicación tecnológica'."},
{texto:"El efecto mariposa es un concepto de la teoría del caos que sugiere que pequeñas variaciones pueden generar grandes consecuencias. El ejemplo clásico: el aleteo de una mariposa en Brasil puede desencadenar un tornado en Texas. Fue popularizado por el meteorólogo Edward Lorenz en los años 60. Implica que sistemas complejos como el clima son imposibles de predecir a largo plazo.",enunciado:"¿Quién popularizó el efecto mariposa?",opciones:["Edward Lorenz","Isaac Newton","Albert Einstein","Charles Darwin","Nikola Tesla"],correcta:0,solucion:"El texto indica 'popularizado por el meteorólogo Edward Lorenz en los años 60'."},
{texto:"El efecto mariposa es un concepto de la teoría del caos que sugiere que pequeñas variaciones pueden generar grandes consecuencias. El ejemplo clásico: el aleteo de una mariposa en Brasil puede desencadenar un tornado en Texas. Fue popularizado por el meteorólogo Edward Lorenz en los años 60. Implica que sistemas complejos como el clima son imposibles de predecir a largo plazo.",enunciado:"¿Qué implica el efecto mariposa sobre el clima?",opciones:["Es imposible predecirlo a largo plazo","Es totalmente predecible","No cambia nunca","Solo depende del sol","Es cíclico exacto"],correcta:0,solucion:"El texto menciona 'sistemas complejos como el clima son imposibles de predecir a largo plazo'."},
{texto:"La meditación Vipassana es una de las técnicas de meditación más antiguas, originada en la India hace 2,500 años. Consiste en observar las sensaciones corporales sin reaccionar a ellas, desarrollando ecuanimidad. Se enseña en retiros de 10 días en silencio absoluto. Investigaciones muestran que reduce la reactividad emocional y aumenta la densidad de materia gris en el cerebro.",enunciado:"¿Cuánto duran los retiros de Vipassana?",opciones:["10 días","1 día","3 días","1 mes","1 año"],correcta:0,solucion:"El texto dice 'se enseña en retiros de 10 días en silencio absoluto'."},

{texto:"La Guerra de Arauco fue el conflicto más largo de la historia de Chile, durando más de 300 años entre españoles y mapuches. Comenzó en 1536 y terminó oficialmente en 1883. Los mapuches resistieron la conquista española adaptando tácticas militares europeas. La obra 'La Araucana' de Alonso de Ercilla narra este conflicto, aunque desde una perspectiva hispana.",enunciado:"¿Cuánto duró la Guerra de Arauco?",opciones:["Más de 300 años","50 años","100 años","10 años","500 años"],correcta:0,solucion:"El texto indica 'durando más de 300 años entre españoles y mapuches'."},

{texto:"El bosque de algas gigantes (Macrocystis pyrifera) forma ecosistemas submarinos frente a las costas chilenas. Estas algas pueden crecer hasta 50 cm por día, formando verdaderos bosques submarinos que albergan erizos, locos y peces. La extracción para producir alginato (usado en alimentos y cosméticos) amenaza estos ecosistemas. Áreas marinas protegidas buscan conservarlos.",enunciado:"¿Cuánto pueden crecer las algas gigantes por día?",opciones:["Hasta 50 cm","1 cm","10 cm","1 metro","5 metros"],correcta:0,solucion:"El texto dice 'pueden crecer hasta 50 cm por día'."},

{texto:"El método socrático de enseñanza se basa en hacer preguntas que guíen al estudiante a descubrir la verdad por sí mismo. Sócrates lo aplicaba en las plazas de Atenas hace 2,400 años. Hoy se usa en facultades de Derecho y escuelas de negocios. A diferencia de la clase magistral, desarrolla pensamiento crítico y capacidad argumentativa.",enunciado:"¿En qué se basa el método socrático?",opciones:["Hacer preguntas que guíen al descubrimiento","Dar conferencias largas","Memorizar textos","Exámenes escritos","Trabajos grupales"],correcta:0,solucion:"El texto indica 'se basa en hacer preguntas que guíen al estudiante a descubrir la verdad'."},
{texto:"El método socrático de enseñanza se basa en hacer preguntas que guíen al estudiante a descubrir la verdad por sí mismo. Sócrates lo aplicaba en las plazas de Atenas hace 2,400 años. Hoy se usa en facultades de Derecho y escuelas de negocios. A diferencia de la clase magistral, desarrolla pensamiento crítico y capacidad argumentativa.",enunciado:"¿Qué habilidades desarrolla este método?",opciones:["Pensamiento crítico y capacidad argumentativa","Memorización","Velocidad lectora","Caligrafía","Cálculo mental"],correcta:0,solucion:"El texto dice 'desarrolla pensamiento crítico y capacidad argumentativa'."},
{texto:"La agricultura regenerativa va más allá de lo orgánico: busca restaurar la salud del suelo. Técnicas como cultivos de cobertura, rotación de ganado y cero labranza aumentan la materia orgánica del suelo. Suelos sanos capturan más carbono atmosférico, ayudando a mitigar el cambio climático. En Chile, viñas y productores de aceite de oliva están adoptando estas prácticas.",enunciado:"¿Qué busca la agricultura regenerativa?",opciones:["Restaurar la salud del suelo","Solo producir orgánico","Maximizar ganancias","Usar más pesticidas","Monocultivo"],correcta:0,solucion:"El texto menciona 'busca restaurar la salud del suelo'."},

{texto:"El sueño polifásico consiste en dormir en varios bloques cortos en lugar de uno largo. Leonardo da Vinci supuestamente dormía 20 minutos cada 4 horas. Aunque algunos 'biohackers' lo promueven, la ciencia médica advierte que el sueño monofásico de 7-9 horas es el más saludable. La privación crónica de sueño aumenta el riesgo de Alzheimer y enfermedades cardiovasculares.",enunciado:"¿Cómo dormía supuestamente Leonardo da Vinci?",opciones:["20 minutos cada 4 horas","8 horas seguidas","12 horas diarias","Solo de noche","Nunca dormía"],correcta:0,solucion:"El texto indica 'Leonardo da Vinci supuestamente dormía 20 minutos cada 4 horas'."},

{texto:"La pesca de arrastre de fondo destruye ecosistemas marinos al pasar redes lastradas sobre el lecho oceánico. Arrasa corales milenarios, esponjas y todo lo que encuentra a su paso. Por cada kilo de camarón capturado, se descartan hasta 10 kilos de fauna acompañante. Organizaciones como Oceana luchan por prohibir esta práctica en áreas vulnerables.",enunciado:"¿Qué proporción de fauna acompañante se descarta por kilo de camarón?",opciones:["Hasta 10 kilos","1 kilo","50 kilos","100 kilos","No se descarta nada"],correcta:0,solucion:"El texto dice 'por cada kilo de camarón capturado, se descartan hasta 10 kilos de fauna acompañante'."},

{texto:"El café de comercio justo garantiza que los productores reciban un precio mínimo por su cosecha, independientemente de las fluctuaciones del mercado. También prohíbe el trabajo infantil y promueve prácticas agrícolas sostenibles. El sello Fairtrade certifica estos estándares. Los consumidores pagan un sobreprecio que financia proyectos comunitarios en países productores.",enunciado:"¿Qué garantiza el comercio justo a los productores?",opciones:["Un precio mínimo por su cosecha","El precio más alto del mercado","Exclusividad de venta","Subsidios gubernamentales","Maquinaria gratis"],correcta:0,solucion:"El texto indica 'garantiza que los productores reciban un precio mínimo por su cosecha'."},

{texto:"La bilirrubina es un pigmento amarillo producido por la degradación de glóbulos rojos. Su acumulación causa ictericia, tornando amarilla la piel y los ojos. En recién nacidos es común y se trata con fototerapia. Niveles muy altos pueden causar daño cerebral (kernicterus). El hígado normalmente la procesa y excreta en la bilis.",enunciado:"¿Qué causa la acumulación de bilirrubina?",opciones:["Ictericia (piel y ojos amarillos)","Anemia","Hipertensión","Diabetes","Asma"],correcta:0,solucion:"El texto dice 'su acumulación causa ictericia, tornando amarilla la piel y los ojos'."},
{texto:"La bilirrubina es un pigmento amarillo producido por la degradación de glóbulos rojos. Su acumulación causa ictericia, tornando amarilla la piel y los ojos. En recién nacidos es común y se trata con fototerapia. Niveles muy altos pueden causar daño cerebral (kernicterus). El hígado normalmente la procesa y excreta en la bilis.",enunciado:"¿Cómo se trata la ictericia en recién nacidos?",opciones:["Fototerapia","Cirugía","Antibióticos","Quimioterapia","Diálisis"],correcta:0,solucion:"El texto menciona 'en recién nacidos es común y se trata con fototerapia'."},
{texto:"El albinismo es una condición genética caracterizada por la ausencia total o parcial de melanina. Afecta la pigmentación de piel, cabello y ojos. Las personas con albinismo tienen mayor riesgo de cáncer de piel y problemas visuales como fotofobia y nistagmo. Es una condición recesiva: ambos padres deben portar el gen para que el hijo lo manifieste.",enunciado:"¿Qué pigmento falta en el albinismo?",opciones:["Melanina","Hemoglobina","Clorofila","Caroteno","Bilirrubina"],correcta:0,solucion:"El texto dice 'ausencia total o parcial de melanina'."},

{texto:"El kayak de mar permite explorar costas inaccesibles por tierra. En Chile, la Patagonia ofrece fiordos, glaciares y canales ideales para esta actividad. El avistamiento de ballenas, delfines y lobos marinos es frecuente. Requiere entrenamiento en rescate y conocimiento de mareas. Torres del Paine y el archipiélago de Chiloé son destinos populares para kayakistas.",enunciado:"¿Qué animales se pueden avistar frecuentemente?",opciones:["Ballenas, delfines y lobos marinos","Osos y pumas","Cóndores y águilas","Pingüinos exclusivamente","Peces de colores"],correcta:0,solucion:"El texto menciona 'el avistamiento de ballenas, delfines y lobos marinos es frecuente'."},

{texto:"El grafeno es un material compuesto por una sola capa de átomos de carbono. Es 200 veces más resistente que el acero, transparente, flexible y conduce electricidad mejor que el cobre. Descubierto en 2004 por Andre Geim y Konstantin Novoselov (Premio Nobel 2010), promete revolucionar la electrónica, las baterías y los materiales de construcción.",enunciado:"¿Quiénes descubrieron el grafeno?",opciones:["Andre Geim y Konstantin Novoselov","Marie y Pierre Curie","Watson y Crick","Einstein","Hawking"],correcta:0,solucion:"El texto menciona 'descubierto en 2004 por Andre Geim y Konstantin Novoselov'."},

{texto:"La fermentación es un proceso metabólico que convierte azúcares en ácidos, gases o alcohol. Es una de las biotecnologías más antiguas, usada para hacer pan, cerveza, yogur y kimchi. Louis Pasteur demostró que la causan microorganismos, no la generación espontánea. La fermentación láctica y alcohólica son las más comunes en la industria alimentaria.",enunciado:"¿Quién demostró el origen microbiano de la fermentación?",opciones:["Louis Pasteur","Alexander Fleming","Robert Koch","Antoni van Leeuwenhoek","Gregor Mendel"],correcta:0,solucion:"El texto dice 'Louis Pasteur demostró que la causan microorganismos'."},

{texto:"El teletrabajo se masificó durante la pandemia de COVID-19. Ahorra tiempo de desplazamiento y reduce emisiones de CO₂. Sin embargo, difumina los límites entre vida laboral y personal, aumentando el riesgo de agotamiento (burnout). Empresas están adoptando modelos híbridos que combinan oficina y trabajo remoto. La legislación chilena reconoce el derecho al teletrabajo desde 2020.",enunciado:"¿Qué riesgo tiene el teletrabajo según el texto?",opciones:["Agotamiento (burnout) por difuminar límites","Más vacaciones","Mejor sueño","Menos estrés","Más ejercicio"],correcta:0,solucion:"El texto indica 'aumentando el riesgo de agotamiento (burnout)'."},

{texto:"Los arrecifes artificiales se crean hundiendo estructuras como barcos en desuso o bloques de concreto para fomentar vida marina. Ofrecen sustrato para corales y refugio para peces. En Chile, el hundimiento controlado de buques ha creado arrecifes que atraen buceadores. Sin embargo, deben diseñarse cuidadosamente para no contaminar ni dañar ecosistemas existentes.",enunciado:"¿Qué materiales se usan para arrecifes artificiales?",opciones:["Barcos en desuso y bloques de concreto","Solo plástico","Madera exclusivamente","Vidrio","Papel"],correcta:0,solucion:"El texto dice 'hundiendo estructuras como barcos en desuso o bloques de concreto'."},

{texto:"La terapia de exposición se usa para tratar fobias y trastorno de estrés postraumático. Consiste en exponer gradualmente al paciente al estímulo temido en un ambiente seguro. La realidad virtual permite simular situaciones como volar en avión o hablar en público. La evidencia muestra que es uno de los tratamientos psicológicos más efectivos.",enunciado:"¿Para qué trastornos se usa la terapia de exposición?",opciones:["Fobias y estrés postraumático","Diabetes","Hipertensión","Asma","Artritis"],correcta:0,solucion:"El texto indica 'se usa para tratar fobias y trastorno de estrés postraumático'."},

{texto:"El pueblo selk'nam habitó Tierra del Fuego por más de 10,000 años. Eran cazadores-recolectores nómadas que resistieron las duras condiciones del extremo sur. La colonización europea, las enfermedades y el genocidio los extinguieron en el siglo XX. Su legado persiste en la toponimia, el arte corporal y la memoria de los pueblos originarios.",enunciado:"¿Dónde habitaba el pueblo selk'nam?",opciones:["Tierra del Fuego","Desierto de Atacama","Valle Central","Patagonia norte","Isla de Pascua"],correcta:0,solucion:"El texto dice 'el pueblo selk'nam habitó Tierra del Fuego por más de 10,000 años'."},

{texto:"La economía de la atención describe cómo la información abundante genera escasez de atención. En internet, las plataformas compiten por nuestro tiempo: cada notificación, cada video sugerido está diseñado para mantenernos enganchados. Esto puede generar adicción y reducir la capacidad de concentración profunda. 'La atención es el nuevo petróleo', afirman expertos en tecnología.",enunciado:"¿Qué genera escasez según la economía de la atención?",opciones:["La atención","El dinero","El petróleo","La información","El tiempo"],correcta:0,solucion:"El texto dice 'la información abundante genera escasez de atención'."},
{texto:"La economía de la atención describe cómo la información abundante genera escasez de atención. En internet, las plataformas compiten por nuestro tiempo: cada notificación, cada video sugerido está diseñado para mantenernos enganchados. Esto puede generar adicción y reducir la capacidad de concentración profunda. 'La atención es el nuevo petróleo', afirman expertos en tecnología.",enunciado:"¿Qué frase resume este concepto?",opciones:["'La atención es el nuevo petróleo'","'El tiempo es dinero'","'El conocimiento es poder'","'La práctica hace al maestro'","'El fin justifica los medios'"],correcta:0,solucion:"El texto menciona 'la atención es el nuevo petróleo, afirman expertos en tecnología'."},
{texto:"El proceso de momificación egipcia duraba 70 días. Extraían los órganos (excepto el corazón) y deshidrataban el cuerpo con natrón, una sal natural. Luego lo envolvían en vendas de lino con amuletos protectores. Creían que la preservación del cuerpo era esencial para la vida eterna. Solo la élite podía permitirse este costoso ritual.",enunciado:"¿Qué órgano NO extraían los egipcios?",opciones:["El corazón","El cerebro","Los pulmones","El hígado","El estómago"],correcta:0,solucion:"El texto indica 'extraían los órganos (excepto el corazón)'."},

{texto:"El vuelo de los cóndores andinos puede alcanzar alturas de 5,000 metros. Aprovechan corrientes térmicas para planear sin batir sus alas, ahorrando energía. Son aves carroñeras que limpian el ecosistema. En Chile habitan en la Cordillera de los Andes y son considerados símbolo nacional junto al huemul.",enunciado:"¿Qué altura pueden alcanzar los cóndores?",opciones:["5,000 metros","1,000 metros","500 metros","10,000 metros","100 metros"],correcta:0,solucion:"El texto menciona 'pueden alcanzar alturas de 5,000 metros'."},

{texto:"La desalación convierte agua de mar en agua potable. Plantas desaladoras por ósmosis inversa operan en el norte de Chile, abasteciendo a ciudades como Antofagasta. El proceso consume mucha energía, pero es vital en zonas áridas. Los avances en energía solar podrían hacerla más sostenible.",enunciado:"¿Qué método de desalación menciona el texto?",opciones:["Ósmosis inversa","Evaporación","Destilación","Filtración simple","Congelación"],correcta:0,solucion:"El texto indica 'plantas desaladoras por ósmosis inversa'."},

{texto:"El idioma japonés combina tres sistemas de escritura: kanji (caracteres chinos), hiragana y katakana (silabarios). Un texto típico usa los tres simultáneamente. Aprender los 2,136 kanjis de uso común toma años. El japonés tiene cuatro niveles de formalidad según el contexto social.",enunciado:"¿Cuántos sistemas de escritura usa el japonés?",opciones:["Tres","Uno","Dos","Cuatro","Cinco"],correcta:0,solucion:"El texto dice 'combina tres sistemas de escritura: kanji, hiragana y katakana'."},

{texto:"El efecto placebo ocurre cuando un paciente mejora al recibir un tratamiento inerte solo porque cree que es real. Demuestra el poder de la mente sobre el cuerpo. Su contraparte es el efecto nocebo, donde expectativas negativas causan síntomas reales. Los ensayos clínicos deben controlar ambos efectos.",enunciado:"¿Qué es el efecto nocebo?",opciones:["Expectativas negativas que causan síntomas reales","Un medicamento potente","Una cirugía","Un placebo potenciado","Una terapia alternativa"],correcta:0,solucion:"El texto dice 'expectativas negativas causan síntomas reales'."},
{texto:"El efecto placebo ocurre cuando un paciente mejora al recibir un tratamiento inerte solo porque cree que es real. Demuestra el poder de la mente sobre el cuerpo. Su contraparte es el efecto nocebo, donde expectativas negativas causan síntomas reales. Los ensayos clínicos deben controlar ambos efectos.",enunciado:"¿Por qué deben controlarse en ensayos clínicos?",opciones:["Porque pueden distorsionar los resultados","Son peligrosos","No tienen importancia","Solo afectan a niños","Son ilegales"],correcta:0,solucion:"El texto indica 'los ensayos clínicos deben controlar ambos efectos'."},
{texto:"La arquitectura bioclimática diseña edificios aprovechando las condiciones climáticas del entorno. Orientación, aislamiento y ventilación natural reducen el consumo energético. En el norte de Chile se usan muros gruesos que acumulan calor diurno y lo liberan de noche. Es una estrategia milenaria redescubierta por la arquitectura sustentable.",enunciado:"¿Qué técnica se usa en el norte de Chile?",opciones:["Muros gruesos que acumulan calor","Aire acondicionado","Calefacción central","Paneles solares exclusivamente","Ventanas pequeñas"],correcta:0,solucion:"El texto menciona 'muros gruesos que acumulan calor diurno y lo liberan de noche'."},

{texto:"Los geiseres del Tatio, en el altiplano chileno, son el campo geotérmico más alto del mundo (4,320 msnm). Al amanecer, columnas de vapor emergen de la tierra helada creando un espectáculo natural. El sitio es sagrado para comunidades atacameñas. El turismo debe ser regulado para proteger este frágil ecosistema.",enunciado:"¿A qué altitud se encuentra el Tatio?",opciones:["4,320 msnm","2,000 msnm","1,000 msnm","5,500 msnm","500 msnm"],correcta:0,solucion:"El texto menciona 'el campo geotérmico más alto del mundo (4,320 msnm)'."},

{texto:"La técnica del 'deep work' (trabajo profundo) propone sesiones de concentración intensa sin interrupciones. El autor Cal Newport argumenta que esta habilidad es cada vez más escasa y valiosa en la economía del conocimiento. Recomienda bloques de 90 minutos sin teléfono ni internet para tareas cognitivamente exigentes.",enunciado:"¿Quién popularizó el concepto de 'deep work'?",opciones:["Cal Newport","Tim Ferriss","Simon Sinek","Malcolm Gladwell","Daniel Goleman"],correcta:0,solucion:"El texto menciona 'el autor Cal Newport argumenta que esta habilidad es cada vez más escasa'."},

{texto:"El desierto de Atacama es el más árido del mundo fuera de los polos. Algunas estaciones meteorológicas no han registrado lluvia en 500 años. Sin embargo, la camanchaca (niebla costera) permite la vida de cactus y líquenes. La minería del cobre extrae agua de napas subterráneas que datan de la última glaciación.",enunciado:"¿Qué es la camanchaca?",opciones:["Niebla costera que permite vida en el desierto","Un tipo de cactus","Un animal del desierto","Un volcán","Un río subterráneo"],correcta:0,solucion:"El texto dice 'la camanchaca (niebla costera) permite la vida de cactus y líquenes'."},

{texto:"El huemul es un ciervo endémico de los bosques andino-patagónicos de Chile y Argentina. Está en peligro de extinción con menos de 2,000 ejemplares. Aparece en el escudo nacional chileno junto al cóndor. La fragmentación de su hábitat y la caza ilegal son sus principales amenazas.",enunciado:"¿Cuántos ejemplares de huemul quedan aproximadamente?",opciones:["Menos de 2,000","10,000","50,000","500","100,000"],correcta:0,solucion:"El texto indica 'en peligro de extinción con menos de 2,000 ejemplares'."},

{texto:"La 'flow state' (estado de flujo) es una inmersión total en una actividad. El tiempo parece desaparecer. Fue descrito por el psicólogo Mihály Csíkszentmihályi. Ocurre cuando el desafío iguala a la habilidad del practicante.",enunciado:"¿Quién describió el estado de flujo?",opciones:["Mihály Csíkszentmihályi","Sigmund Freud","Carl Jung","Jean Piaget","Abraham Maslow"],correcta:0,solucion:"El texto dice 'descrito por el psicólogo Mihály Csíkszentmihályi'."},

{texto:"La 'regla 80/20' o principio de Pareto dice que el 80% de resultados viene del 20% de causas. En negocios, el 20% de clientes genera el 80% de ventas. Aplicarlo ayuda a priorizar tareas de alto impacto. Fue formulado por el economista Vilfredo Pareto.",enunciado:"¿Quién formuló el principio de Pareto?",opciones:["Vilfredo Pareto","Adam Smith","John Keynes","Milton Friedman","Karl Marx"],correcta:0,solucion:"El texto dice 'formulado por el economista Vilfredo Pareto'."},

function estimarPuntajePAES(pct){
  if(pct>=98)return 1000;
  if(pct>=95)return Math.round(950+(pct-95)*10);
  if(pct>=85)return Math.round(800+(pct-85)*15);
  if(pct>=75)return Math.round(700+(pct-75)*10);
  if(pct>=60)return Math.round(600+(pct-60)*6.67);
  if(pct>=45)return Math.round(500+(pct-45)*6.67);
  if(pct>=30)return Math.round(400+(pct-30)*6.67);
  if(pct>=15)return Math.round(250+(pct-15)*10);
  return Math.round(100+(pct/15)*150);
}

let preguntasExamen=[], respuestas=new Array(65).fill(null), indice=0, finalizado=false, intentoActual=0;

function barajar(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function barajarOpciones(pregunta){
  const letras = ['A','B','C','D','E'];
  const opcionesConIndice = pregunta.opciones.map((op, i) => ({texto: op, indiceOriginal: i}));
  for(let i = opcionesConIndice.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [opcionesConIndice[i], opcionesConIndice[j]] = [opcionesConIndice[j], opcionesConIndice[i]];
  }
  const nuevaCorrecta = opcionesConIndice.findIndex(op => op.indiceOriginal === pregunta.correcta);
  return {
    opciones: opcionesConIndice.map(op => op.texto),
    correcta: nuevaCorrecta
  };
}

function iniciarExamen(){
  const prev=JSON.parse(localStorage.getItem('v3s_lect_650')||'[]');
  if(prev.length>=10){
    if(confirm('⚠️ Ya usaste los 10 intentos. ¿Reiniciar historial para 10 más?')){
      localStorage.setItem('v3s_lect_650','[]');
    }else return;
  }
  const usadas=new Set(prev.flat());
  let disp=bancoLectura.filter((_,i)=>!usadas.has(i));
  if(disp.length<65){
    alert('🔄 Banco agotado. Reiniciando historial automáticamente.');
    localStorage.setItem('v3s_lect_650','[]');
    disp=[...bancoLectura];
  }
  const sel=barajar([...disp]).slice(0,65);
  prev.push(sel.map(p=>bancoLectura.indexOf(p)));
  localStorage.setItem('v3s_lect_650',JSON.stringify(prev));
  preguntasExamen = sel.map(p => {
  const barajada = barajarOpciones(p);
  return {
    texto: p.texto,
    enunciado: p.enunciado,
    opciones: barajada.opciones,
    correcta: barajada.correcta,
    solucion: p.solucion
  };
});
respuestas=new Array(65).fill(null);indice=0;finalizado=false;intentoActual=prev.length;renderizar();
}

function navegar(d){const n=indice+d;if(n>=0&&n<65){indice=n;renderizar();}}

function calcular(){let c=0;preguntasExamen.forEach((p,i)=>{if(respuestas[i]===p.correcta)c++;});return{correctas:c,total:65};}
